/* Hallmark · checked: 2026-11-23 · genre: modern-minimal (inferred) · shape: app screen · theme: Lam (Cobalt colours, app scope)

 * built: the project (Rootcash → Flowsup) · redesign: full · v2.0.0 */
:root{
  --paper:#F4F6FA; --card:#FCFDFF; --paper-2:#EEF2F8; --paper-3:#E4EAF3;
  --ink:#15213A; --ink-2:#2B3852; --muted:#56637A; --rule:#D9E0EB; --rule-2:#E8ECF3;
  --in:#2456D3; --in-2:#1D47B3; --in-mid:#BCCDF5; --in-soft:#E2E9FB; --in-soft-ink:#1C3F9E; --on-in:#FCFDFF;
  --neg:#C2410C; --neg-soft:#FBE9DC; --neg-soft-ink:#9A3412;
  --scrim:#15213A66; --shadow:0 12px 32px #15213A29;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;
  --r:12px; --rc:10px; --gap:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font:15px/1.45 var(--font);background:var(--paper);color:var(--ink-2);overflow-x:clip;overflow-y:scroll;scrollbar-gutter:stable;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body{margin:0;overflow-x:clip;background:var(--paper)}
#app{max-width:1400px;margin:0 auto;padding:0 clamp(16px,2.4vw,36px) 24px}
h1,h2,p{margin:0}
h2{font:600 18px/1.25 var(--font-d);color:var(--ink);letter-spacing:-.01em;white-space:nowrap;text-wrap:balance}
button,input{font:inherit;color:inherit;border:0;background:none;padding:0;min-width:0}
button{cursor:pointer;transition:background-color .12s,border-color .12s,color .12s}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:2px solid var(--in);outline-offset:2px}
input{outline-offset:0}
b{font-weight:600}
.neg{color:var(--neg)!important} .pos{color:var(--in)!important} .mut{color:var(--muted)}
::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:var(--rule);border-radius:10px;border:2px solid var(--paper)}

/* Thanh trên cùng */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:16px 0;border-bottom:1px solid var(--ink);margin-bottom:24px}
.brand{font:700 23px/1 var(--font-d);color:var(--ink);letter-spacing:-.035em;white-space:nowrap}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{height:36px;padding:0 15px;border-radius:999px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab:hover{color:var(--ink);background:var(--paper-2)}
.tab.on{background:var(--ink);color:var(--card)}
.grow{flex:1 1 0}
.month{display:flex;align-items:center;gap:2px;border:1px solid var(--rule);border-radius:var(--rc);background:var(--card);padding:3px}
.month b{min-width:8.6em;text-align:center;color:var(--ink);white-space:nowrap}
.ic{width:34px;height:34px;border-radius:8px;display:inline-grid;place-items:center;color:var(--ink);font-size:17px;line-height:1;flex:none}

<script id="domain">
/* ===== Phần tính toán: hàm thuần, không đụng giao diện. Tiền là số nguyên đồng. ===== */
const D = (() => {
  const pad = n => String(n).padStart(2, '0');
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  const dim = k => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();           // số ngày trong tháng
  const mOK = x => /^\d{4}-(0[1-9]|1[0-2])$/.test(x || '');
  const dOK = x => /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(x || '') && +x.slice(8) <= dim(x.slice(0, 7));
  const shift = (k, n) => {
    const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  };
  const dateAt = (k, d) => k + '-' + pad(Math.min(d, dim(k)));                      // ngày 31 → chốt cuối tháng
  const addM = (date, n) => dateAt(shift(date.slice(0, 7), n), +date.slice(8));
  const diff = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
  const utc = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8));
  const days = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);                     // số ngày thực tế a → b
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  /* Các ngày trả: kỳ đầu, rồi mỗi tháng cùng ngày, kỳ cuối = ngày đáo hạn (có thể lẻ ngày). */
  function dates(l) {
    if (l.open) return [];
    const out = [];
    for (let i = 0; i < 361; i++) { const d = addM(l.first, i); if (d >= l.end) break; out.push(d); }
    out.push(l.end);
    return out;
  }

  /* Lịch trả của một khoản — lãi quy về LÃI NGÀY × số ngày thực tế của từng kỳ. Dùng chung cho đi vay và cho vay.
     mode   (gốc):  equal = đều mỗi kỳ | bullet = một lần lúc đáo hạn | annuity = góp đều (gốc+lãi gần cố định)
     basis  (lãi):  none | flat = trên gốc ban đầu | reducing = trên dư nợ | fixed = số tiền cố định/kỳ
                    | total = tổng tiền lãi tuyệt đối, chia theo số ngày của từng kỳ
     timing (lãi):  periodic = mỗi kỳ | upfront = trả trước toàn bộ vào ngày kỳ đầu | end = một lần lúc đáo hạn
     Lãi ngày = lãi năm ÷ 365 (lãi tháng × 12 ÷ 365). Phần lẻ do làm tròn dồn vào kỳ cuối. */
  function schedule(l) {
    if (l.open) {                                                                   // chưa hẹn ngày trả GỐC: gốc không lên lịch, lãi (nếu có) trả hằng tháng từ ngày kỳ đầu
      const rows = [];
      if (l.basis !== 'none') {
        const r = l.basis === 'flat' || l.basis === 'reducing' ? (l.unit === 'year' ? l.rate : l.rate * 12) / 100 / 365 : 0;
        let prev = l.start;
        for (let i = 0; i < 240; i++) {
          const date = addM(l.first, i), dd = Math.max(0, days(prev, date)), acc = r ? Math.round(l.principal * r * dd) : l.fixed;
          rows.push({ i: i + 1, date, days: dd, principal: 0, accrued: acc, interest: acc, pay: acc, after: l.principal });
          prev = date;
        }
      }
      return { rows, total: 0, upfront: 0, end: null, term: 0, span: 0, open: true };
    }
    const ds = dates(l), n = ds.length, P = l.principal, span = days(l.start, l.end);
    const share = d => span > 0 ? Math.round(l.fixed * Math.min(1, d / span)) : l.fixed;   // phần tổng lãi phát sinh sau d ngày
    const rd = l.basis === 'flat' || l.basis === 'reducing' ? (l.unit === 'year' ? l.rate : l.rate * 12) / 100 / 365 : 0;
    const rm = rd * 365 / 12;
    const annuity = l.mode === 'annuity' && l.basis === 'reducing' && l.timing === 'periodic' && rd > 0;
    const A = annuity ? Math.round(P * rm / (1 - (1 + rm) ** -n)) : 0, base = Math.floor(P / n);
    const rows = []; let bal = P, prev = l.start;
    ds.forEach((date, i) => {
      const last = i === n - 1, dd = Math.max(0, days(prev, date)), at = days(l.start, date);
      const accrued = l.basis === 'fixed' ? l.fixed
        : l.basis === 'total' ? (last ? l.fixed : share(at)) - share(at - dd)
        : Math.round((l.basis === 'flat' ? P : bal) * rd * dd);
      const principal = last ? bal : annuity ? Math.min(bal, Math.max(0, A - accrued)) : l.mode === 'bullet' ? 0 : base;
      rows.push({ i: i + 1, date, days: dd, principal, accrued, interest: 0, after: bal -= principal });
      prev = date;
    });
    const total = sum(rows, x => x.accrued); let upfront = 0;
    if (l.timing === 'upfront') rows[0].interest = upfront = total;
    else if (l.timing === 'end') rows[n - 1].interest = total;
    else rows.forEach(x => x.interest = x.accrued);
    rows.forEach(x => x.pay = x.principal + x.interest);
    return { rows, total, upfront, end: l.end, term: n, span };
  }

  /* Áp lực thanh khoản M/x: tiền phải trả kỳ đầu trên mỗi đồng gốc. */
  function liquidity(l, sc = schedule(l)) {
    if (!sc.rows.length) return null;
    const f = sc.open ? sc.rows[1] || sc.rows[0] : sc.rows[0], peak = sc.rows.reduce((a, b) => b.pay > a.pay ? b : a);   // chưa hẹn ngày: lấy kỳ thường
    return { p: f.principal / l.principal, i: f.interest / l.principal, rate: f.pay / l.principal, peak, first: f };
  }

  /* Dòng tiền của một khoản trong tháng k. Đi vay: trả gốc/lãi (−). Cho vay: thu gốc/lãi (+).
     Tiền giải ngân (nhận vay / chuyển cho vay) chỉ đổi số dư, KHÔNG phải free float. */
  function loanEvents(l, k, sc = schedule(l)) {
    const ev = [], lend = l.dir === 'lend', s = lend ? 1 : -1;
    const add = (date, value, cat, note) => ev.push({ day: +date.slice(8), value, cat, id: l.id, label: l.label + ' · ' + note });
    if (l.disburse && l.start.slice(0, 7) === k) add(l.start, -s * l.principal, lend ? 'lendOut' : 'loanIn', lend ? 'chuyển cho vay' : 'nhận vay');
    for (const r of sc.rows) if (r.date.slice(0, 7) === k) {
      const v = lend ? 'thu' : '';
      if (r.principal) add(r.date, s * r.principal, lend ? 'collect' : 'principal', `${v ? 'thu ' : ''}gốc kỳ ${r.i}/${sc.term}`);
      if (r.interest) add(r.date, s * r.interest, lend ? 'collect' : 'interest', sc.upfront ? `${v ? 'thu ' : ''}lãi trả trước` : sc.open ? `${v ? 'thu ' : ''}lãi tháng ${+r.date.slice(5, 7)}` : `${v ? 'thu ' : ''}lãi kỳ ${r.i}/${sc.term}`);
    }
    return ev;
  }

  /* Trạng thái khoản tính đến hết tháng k. */
  function loanAt(l, k, sc = schedule(l)) {
    if (l.open) return { state: l.start.slice(0, 7) > k ? 'future' : 'live', paid: 0, balance: l.principal };
    const paid = sc.rows.filter(r => r.date.slice(0, 7) <= k);
    const state = l.start.slice(0, 7) > k ? 'future' : sc.end.slice(0, 7) < k ? 'done' : 'live';
    return { state, paid: paid.length, balance: l.principal - sum(paid, r => r.principal) };
  }

  /* Vị thế nợ cuối tháng k: đang vay, cho vay, lãi còn lại hai chiều. */
  function position(s, k) {
    const r = { borrow: 0, lend: 0, intPay: 0, intGet: 0, nB: 0, nL: 0 };
    for (const l of s.loans) {
      const sc = schedule(l), at = loanAt(l, k, sc);
      if (at.state === 'future' || at.balance <= 0) continue;
      const left = sc.open ? 0 : sum(sc.rows.filter(x => x.date.slice(0, 7) > k), x => x.interest);   // chưa hẹn ngày: không biết lãi còn bao nhiêu
      if (l.dir === 'lend') { r.lend += at.balance; r.intGet += left; r.nL++; } else { r.borrow += at.balance; r.intPay += left; r.nB++; }
    }
    r.net = r.borrow - r.lend;
    return r;
  }

  const activeIn = (x, k) => (!x.from || x.from <= k) && (!x.until || k <= x.until);

  /* Một tháng có hai lớp tách bạch:
     • KHUNG (kế hoạch, luôn đủ tháng): FREE FLOAT = Thu + Thu hồi cho vay − Chi phí − Trả nợ (không tính tiền giải ngân).
     • SỐ DƯ (tiền mặt): chạy từ ngày `from` (tháng đầu = ngày nhập số dư) với các dòng tiền từ ngày đó trở đi;
       chi phí trải đều mỗi ngày. Số dư nhập vào không được dùng để suy ra khung. */
  function month(s, k, opening, from = 1) {
    const n = dim(k), all = [];
    for (const x of s.incomes) if (x.amount && activeIn(x, k))
      all.push({ day: Math.min(x.day, n), value: x.amount, cat: 'income', id: x.id, label: x.label || 'Thu' });
    for (const l of s.loans) all.push(...loanEvents(l, k));
    all.sort((a, b) => a.day - b.day);
    const ev = all.filter(e => e.day >= from), t = c => sum(all.filter(e => e.cat === c), e => e.value);
    const income = t('income'), collect = t('collect'), loanIn = t('loanIn'), lendOut = 0 - t('lendOut');
    const principal = 0 - t('principal'), interest = 0 - t('interest');                // 0 − x: tránh hiện "−0"
    const L = sum(s.living.items.filter(x => activeIn(x, k)), x => x.amount), living = L;   // chi phí tháng = các khoản thuộc tháng k
    const free = income + collect - living - principal - interest;
    let num = opening * n; const ds = [];                                             // tử số nguyên → cuối tháng khớp từng đồng
    for (let d = from; d <= n; d++) {
      const rows = ev.filter(e => e.day === d);
      num += sum(rows, e => e.value) * n - L;
      ds.push({ day: d, end: num / n, rows });
    }
    const low = ds.reduce((a, b) => b.end < a.end ? b : a);
    return { k, dim: n, from, opening, income, collect, inflow: income + collect, loanIn, lendOut, living, principal, interest,
      debt: principal + interest, free, end: num / n, days: ds, low, events: ev };
  }

  /* Chốt tháng: mỗi tháng giữ một số dư chốt riêng { date, amount }. Lần chốt mới nhất là "hiện tại".
     • Tháng có chốt: tiền mặt chạy từ ngày chốt; expect = số dư dự tính tại ngày đó theo khung → lệch = chốt − dự tính.
     • Tháng không chốt: nối tiếp số dư cuối tháng trước.
     • Trước lần chốt đầu tiên (zero): không biết số dư nên tính từ 0đ đầu tháng (cuối tháng = free float).
     Tương lai: carry = free float dồn sang tháng sau; ngược lại mỗi tháng bắt đầu lại từ số dư chốt, cum = free float luỹ kế. */
  const checks = s => s.checks?.length ? s.checks : [{ date: s.openDate, amount: s.opening }];
  function timeline(s) {
    const C = [...checks(s)].sort((a, b) => a.date < b.date ? -1 : 1), last = C[C.length - 1], k0 = last.date.slice(0, 7);
    const ks = [...s.incomes, ...s.living.items].map(x => x.from).concat(s.loans.map(l => l.start.slice(0, 7)), C.map(c => c.date.slice(0, 7))).filter(Boolean);
    const first = ks.reduce((a, b) => a < b ? a : b), min = shift(k0, -24), out = [];
    let bal = null, cum = 0;
    for (let k = first < min ? min : first; k <= shift(k0, s.horizon - 1); k = shift(k, 1)) {
      const c = C.find(x => x.date.slice(0, 7) === k), fut = k > k0, d = c ? +c.date.slice(8) : 1;
      let m;
      if (c) {
        m = month(s, k, c.amount, d); m.check = c;
        if (bal !== null && !out[out.length - 1].zero) { m.expect = d === 1 ? bal : month(s, k, bal, 1).days[d - 2].end; m.diff = c.amount - m.expect; }
      } else if (bal === null) { m = month(s, k, 0, 1); m.zero = true; }
      else m = month(s, k, fut && !s.carry ? last.amount : bal, 1);
      m.past = k < k0; bal = m.end;
      if (k === k0) cum = 0;
      m.cum = s.carry || k < k0 ? m.end : (cum += m.free); m.pos = position(s, k); out.push(m);
    }
    return out;
  }
  const project = s => timeline(s).filter(m => !m.past), past = s => timeline(s).filter(m => m.past);

  return { checks, timeline, past, pad, sum, mOK, dOK, dim, shift, dateAt, addM, diff, days, today, dates, schedule, liquidity, loanEvents, loanAt, position, activeIn, month, project };
})();
if (typeof module === 'object') module.exports = D;
</script>
<script>
(() => {
'use strict';
const KEY = 'rootcash:desk:v1', VKEY = 'flowsup:view', $ = q => document.querySelector(q), $$ = q => document.querySelectorAll(q);
const uid = () => crypto.randomUUID?.() || 'rc-' + Date.now() + Math.random().toString(36).slice(2);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '\n': '&#10;' };
const esc = v => String(v ?? '').replace(/[&<>"'\n]/g, c => ESC[c]);

/* ----- Định dạng ----- */
const nf = new Intl.NumberFormat('vi-VN'), dec = (v, d) => v.toLocaleString('vi-VN', { maximumFractionDigits: d });
const sign = n => Math.round(n) < 0 ? '−' : '';
const money = n => sign(n) + nf.format(Math.round(Math.abs(n))) + 'đ';
const signed = n => (Math.round(n) > 0 ? '+' : '') + money(n);
const plain = n => (Math.round(n) > 0 ? '+' : sign(n)) + nf.format(Math.round(Math.abs(n)));
const short = n => {
  const a = Math.abs(n);
  return sign(n) + (a >= 1e9 ? dec(a / 1e9, 2) + ' tỷ' : a >= 1e6 ? dec(a / 1e6, a >= 1e8 ? 0 : 1) + 'tr' : a >= 1e3 ? dec(a / 1e3, 0) + 'k' : Math.round(a) + 'đ');
};
const pct = x => (x * 100).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const mShort = k => `T${+k.slice(5)}/${k.slice(2, 4)}`, mLong = k => `Tháng ${+k.slice(5)}/${k.slice(0, 4)}`;
const dLabel = d => `${d.slice(8)}/${d.slice(5, 7)}/${d.slice(0, 4)}`;
const cls = n => n < 0 ? 'neg' : 'pos', negOnly = n => Math.round(n) < 0 ? 'neg' : '';
const sw = c => `<i class="sw" style="background:var(--${c})"></i>`;

/* ----- Dữ liệu ----- */
const blank = () => {
  const t = D.today();
  return { v: 3, openDate: t, start: t.slice(0, 7), sel: t.slice(0, 7), horizon: 12, opening: 0, checks: [{ date: t, amount: 0 }], carry: true, incomes: [], living: { items: [] }, loans: [], paid: {} };
};
const int = (v, min = 0, max = 1e13) => Math.min(max, Math.max(min, Math.round(+v || 0)));
const pick = (v, list) => list.includes(v) ? v : list[0];
const month = v => D.mOK(v) ? v : null;
/* Lần chốt mới nhất quyết định "hiện tại": openDate / opening / start luôn suy ra từ đó (giữ tương thích file cũ). */
function syncChecks(s) {
  s.checks.sort((a, b) => a.date < b.date ? -1 : 1);
  const last = s.checks[s.checks.length - 1]; s.openDate = last.date; s.opening = last.amount; s.start = last.date.slice(0, 7);
}

function normLoan(x) {
  const basis = pick(x.basis, ['none', 'flat', 'reducing', 'fixed', 'total']);
  const l = {
    id: String(x.id || uid()), dir: pick(x.dir, ['borrow', 'lend']), label: String(x?.label ?? '').slice(0, 120) || 'Khoản vay', principal: int(x.principal, 1),
    start: x.start, first: D.dOK(x.first) && x.first >= x.start ? x.first : D.addM(x.start, 1),
    mode: pick(x.mode, ['equal', 'bullet', 'annuity']), basis,
    timing: basis === 'none' ? 'periodic' : pick(x.timing, ['periodic', 'upfront', 'end']),
    rate: Math.min(100, Math.max(0, +x.rate || 0)), unit: pick(x.unit, ['month', 'year']), fixed: int(x.fixed),
    disburse: !!x.disburse, open: !!x.open, ...(x.note ? { note: String(x.note).slice(0, 200) } : {})
  };
  l.end = D.dOK(x.end) ? x.end : D.addM(l.first, int(x.term, 1, 360) - 1);           // bản cũ chỉ có số kỳ
  if (l.end < l.first) l.end = l.first;
  if (D.dates(l).length > 360) l.end = D.addM(l.first, 359);
  return l;
}

function norm(r) {                                                                   // ép mọi dữ liệu đọc vào về đúng cấu trúc
  const s = blank(); if (!r || typeof r !== 'object') return s;
  const label = x => String(x?.label ?? '').slice(0, 120), id = x => String(x?.id || uid());
  if (D.dOK(r.openDate)) s.openDate = r.openDate; else if (D.mOK(r.start)) s.openDate = r.start + '-01';
  s.start = s.openDate.slice(0, 7);
  s.horizon = pick(+r.horizon, [12, 6, 24]); s.opening = int(r.opening, -1e13); s.carry = r.carry !== false;
  const byMonth = new Map((Array.isArray(r.checks) ? r.checks : []).filter(c => D.dOK(c?.date))
    .map(c => [c.date.slice(0, 7), { date: c.date, amount: int(c.amount, -1e13) }]));       // mỗi tháng một lần chốt
  if (!byMonth.size) byMonth.set(s.openDate.slice(0, 7), { date: s.openDate, amount: s.opening });
  s.checks = [...byMonth.values()]; syncChecks(s);
  s.sel = D.mOK(r.sel) && r.sel >= s.start && r.sel <= D.shift(s.start, s.horizon - 1) ? r.sel : s.start;
  s.incomes = (r.incomes || []).map(x => ({ id: id(x), label: label(x), amount: int(x.amount), day: int(x.day, 1, 31), from: month(x.from), until: month(x.until) }));
  const items = (r.living?.items || []).map(x => ({ id: id(x), label: label(x), amount: int(x.amount), from: month(x.from), until: month(x.until) }));
  if (r.living && 'total' in r.living) {                                            // bản cũ: một khung tổng + các mục chia → mục hàng tháng, phần dư thành "Khác"
    const left = int(r.living.total) - D.sum(items.filter(x => !x.from && !x.until), x => x.amount);
    if (left > 0) items.push({ id: uid(), label: items.length ? 'Khác' : 'Chi phí', amount: left, from: null, until: null });
  }
  s.living = { items };
  s.loans = (r.loans || []).filter(x => x && D.dOK(x.start) && x.principal > 0).map(normLoan);
  /* Đánh dấu đã trả / đã thu: chỉ để theo dõi, không đổi số liệu khung. Khoá = tháng|id|loại|ngày. */
  if (r.paid && typeof r.paid === 'object') for (const [k, v] of Object.entries(r.paid))
    if (v === true && k.length < 200 && /^\d{4}-\d{2}\|/.test(k)) s.paid[k] = true;
  return s;
}

/* Nhận file sao lưu của Rootcash webapp (v2): thu → Thu, chi cố định → mục chi phí, trả nợ → khoản vay 0 lãi cần bổ sung. */
function fromV2(d) {
  const k = D.mOK(d.active) ? d.active : D.today().slice(0, 7), of = kind => (d.items || []).filter(i => i.kind === kind);
  const livKey = Object.keys(d.living || {}).filter(x => x <= k).sort().pop(), liv = livKey ? d.living[livKey] : 0;
  const items = [...(liv ? [{ label: 'Chi phí', amount: liv }] : []), ...of('fixed')];
  const once = of('once').filter(i => i.sign === 1 && D.dOK(i.date));
  const loans = of('debt').map(i => {
    const from = D.mOK(i.from) ? i.from : k, n = D.mOK(i.until) ? Math.max(1, D.diff(from, i.until) + 1) : 120, first = D.dateAt(from, i.day || 1);
    return { id: i.id, label: i.label, principal: i.amount * n, start: D.addM(first, -1), first, term: n, mode: 'equal', basis: 'none', note: 'Nhập từ webapp — bổ sung gốc, lãi, kỳ hạn' };
  });
  const incomes = [...of('in'), ...once.map(i => ({ ...i, day: +i.date.slice(8), from: i.date.slice(0, 7), until: i.date.slice(0, 7) }))];
  return {
    skipped: of('once').length - once.length,
    data: norm({ start: k, opening: Math.max(0, d.openings?.[k] || 0), incomes, living: { total: D.sum(items, i => i.amount), items }, loans })
  };
}

function demo() {
  const t = D.today(), k = t.slice(0, 7), at = (n, d) => D.dateAt(D.shift(k, n), d);
  const L = (label, principal, start, term, o) => ({ label, principal, start, first: D.addM(start, 1), term, mode: 'equal', basis: 'flat', rate: 1.5, ...o });
  return norm({
    openDate: t, opening: 15e6,
    incomes: [{ label: 'Lương', amount: 32e6, day: 5 }, { label: 'Kinh doanh', amount: 12e6, day: 20 }],
    living: { items: [{ label: 'Nhà', amount: 5e6 }, { label: 'Ăn uống', amount: 5.5e6 }, { label: 'Đi lại', amount: 1.5e6 },
      { label: 'Quà Tết', amount: 8e6, from: D.shift(k, 2), until: D.shift(k, 2) }] },
    loans: [
      L('Trả góp A', 120e6, at(-3, 10), 12),
      L('Vay ngắn B (đáo hạn lẻ ngày)', 50e6, at(0, 14), 0, { first: at(1, 14), end: at(3, 25), mode: 'bullet', basis: 'reducing', rate: 12, unit: 'year' }),
      L('Vay C (lãi trả trước)', 60e6, at(1, 15), 6, { timing: 'upfront', rate: 2, disburse: true }),
      L('Bạn D', 20e6, at(-2, 1), 1, { basis: 'none', open: true }),
      L('Cho anh H vay', 40e6, at(-1, 10), 10, { dir: 'lend', rate: 1, first: at(0, 25) }),
      L('Cho bạn P mượn', 5e6, at(-1, 3), 1, { dir: 'lend', basis: 'none', open: true })
    ]
  });
}

/* Lưu trữ: dữ liệu nằm ngay trên máy này. Flowsup.exe mở trang trong hồ sơ riêng nên không lẫn với trình duyệt thường. */
let S = blank(), loadErr = '', toastTimer;
const toast = t => { $('#toast').textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').textContent = '', 4500); };
try { const raw = localStorage.getItem(KEY); if (raw) S = norm(JSON.parse(raw)); } catch { loadErr = 'Không đọc được dữ liệu đã lưu.'; }
function save() {
  if (loadErr) return;                                                              // không ghi đè lên dữ liệu chưa đọc được
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Không lưu được. Hãy Xuất file để giữ dữ liệu.'); }
  autoSave();
}

/* Tự lưu ra file: Flowsup.exe chạy một máy chủ nhỏ chỉ trong máy (127.0.0.1) và ghi bản sao JSON vào Documents\Flowsup
   (bản mới nhất + một bản mỗi ngày). Mã khoá k do exe sinh ra, truyền qua #k=… nên trang khác không đọc/ghi được. */
const AK = new URLSearchParams(location.hash.slice(1)).get('k'), AUTO = /^[a-f0-9]{32}$/.test(AK || '');
const autoUrl = p => `http://127.0.0.1:47613/${p}?k=${AK}`;
const exportBody = () => JSON.stringify({ format: 'rootcash-desktop', version: 3, app: 'Flowsup', exportedAt: new Date().toISOString(), data: S }, null, 2);
let autoState = AUTO ? 'Đang kết nối tự lưu…' : 'Dữ liệu lưu trong app. Mở bằng Flowsup.exe để tự lưu ra file.', autoT;
const setAuto = t => { autoState = t; const e = $('#autoState'); if (e) e.textContent = t; };
function autoSave(now) {
  if (!AUTO || loadErr) return;
  clearTimeout(autoT);
  autoT = setTimeout(async () => {
    try {
      const r = await fetch(autoUrl('save'), { method: 'POST', body: exportBody() }), j = await r.json();
      if (!r.ok) throw 0;
      setAuto(`Đã tự lưu lúc ${new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} vào ${j.dir}`);
    } catch { setAuto('Chưa tự lưu được ra file, dữ liệu vẫn nằm trong app'); }
  }, now ? 0 : 1500);
}
const isEmpty = () => !S.incomes.length && !S.loans.length && !S.living.items.length;

/* ----- Giao diện: ba trang dùng chung nút chọn tháng ----- */
let savedView = 'month'; try { savedView = localStorage.getItem(VKEY) || 'month'; } catch {}
const ui = { open: new Set(), tab: 'borrow', view: ['month', 'plan', 'data'].includes(savedView) ? savedView : 'month', pend: {} };
let ro, cur;

const seg = (act, opts, val) => `<div class="seg">${opts.map(([v, t]) =>
  `<button class="${String(v) === String(val) ? 'on' : ''}" data-act="${act}" data-v="${v}">${t}</button>`).join('')}</div>`;
const moneyIn = (v, attr) => `<input class="money" inputmode="numeric" value="${v ? sign(v) + nf.format(Math.abs(v)) : ''}" placeholder="0" ${attr}>`;
const delBtn = `<button class="ic" data-act="del" aria-label="Xoá dòng này" data-tip="Xoá">×</button>`;

/* Kiểu lặp của một khoản thu / chi: hàng tháng | chỉ một tháng | khoảng tháng tuỳ chọn. */
const recOf = x => !x.from && !x.until ? 'monthly' : x.from === x.until ? 'once' : 'range';
const recName = x => ({ monthly: 'Hàng tháng', once: `Chỉ ${x.from && mShort(x.from)}`,
  range: `${x.from ? mShort(x.from) : '…'} → ${x.until ? mShort(x.until) : '…'}` })[recOf(x)];
const recBtn = x => `<button class="rec ${recOf(x)}" data-act="rec" data-tip="Bấm để đổi: Hàng tháng, Chỉ tháng đang xem, Khoảng tháng">${recName(x)}</button>`;
const rangeBox = x => recOf(x) === 'range' || ui.open.has(x.id) ? `<div class="extra">Từ <input type="month" data-f="from" value="${x.from || ''}">
  đến hết <input type="month" data-f="until" value="${x.until || ''}"></div>` : '';
const incRow = x => `<div class="rw" data-id="${x.id}">
  <input class="lb" data-f="label" value="${esc(x.label)}" placeholder="Tên nguồn thu" aria-label="Tên nguồn thu">${recBtn(x)}
  <label class="dayf">ngày<input data-f="day" type="number" min="1" max="31" value="${x.day}"></label>
  ${moneyIn(x.amount, 'data-f="amount" aria-label="Số tiền"')}${delBtn}${rangeBox(x)}</div>`;
const livRow = x => `<div class="rw liv" data-id="${x.id}">
  <input class="lb" data-f="label" value="${esc(x.label)}" placeholder="Tên khoản chi" aria-label="Tên khoản chi">${recBtn(x)}${moneyIn(x.amount, 'data-f="amount" aria-label="Số tiền"')}${delBtn}${rangeBox(x)}</div>`;

const VIEWS = {
  month: () => `
<section class="row">
  <div class="well low" id="low"></div>
  <div class="eq" id="eq"></div>
</section>
<section class="row">
  <div class="card chartc">
    <div class="hd"><h2>Số dư từng ngày</h2><div class="pills" id="dayPills"></div></div>
    <svg id="day" role="img" aria-label="Số dư cuối mỗi ngày"></svg>
    <div class="legend"><span>${sw('in')}Trên 0</span><span>${sw('neg')}Âm</span></div>
  </div>
  <div class="card due">
    <div class="hd"><h2>Đến hạn</h2><span class="pill in" id="doneTag"></span></div>
    <div class="list" id="dueList"></div>
  </div>
</section>`,
  plan: () => `
<section class="row">
  <div class="card months">
    <div class="hd"><h2>${S.horizon} tháng tới</h2>${seg('horizon', [[6, '6'], [12, '12'], [24, '24 tháng']], S.horizon)}</div>
    <div id="proj"></div>
    <div class="legend"><span>${sw('in-mid')}Dư trong tháng</span><span>${sw('ink')}${S.carry ? 'Số dư cuối tháng' : 'Dư luỹ kế'}</span><span>${sw('neg-soft')}Có ngày âm</span></div>
  </div>
  <div class="posbox" id="pos"></div>
</section>
<section class="card ${ui.tab === 'lend' ? 'lendtab' : ''}">
  <div class="hd"><div class="side"><h2>${ui.tab === 'lend' ? 'Lịch thu về' : 'Lịch hết nợ'}</h2>${tabSeg()}</div><div class="pills" id="openPill"></div></div>
  <div id="payoff"></div>
</section>`,
  data: () => `
<div class="row">
  <div class="dside">
    <div class="well bal">
      <div class="hd" style="margin:0"><h2 id="balCap">Chốt tháng</h2><button class="btn" id="unchk" data-act="unchk">Bỏ chốt</button></div>
      <div class="f">
        <label>Số dư<input class="money fld big" id="opening" inputmode="numeric" placeholder="0"></label>
        <label data-tip="Số dư thật tại đầu ngày này. Mỗi tháng chốt riêng, tháng khác không bị ghi đè">Tại đầu ngày<input class="fld" type="date" id="openDate"></label>
      </div>
      <small class="bnote" id="balNote"></small>
      <div class="mode"><span class="cap" data-tip="Dư trong tháng = thu − chi phí − trả nợ, tính cả tháng, không tính tiền vay về">Dư trong tháng</span>${seg('carry', [[1, 'Giữ lại'], [0, 'Đem đầu tư']], +S.carry)}</div>
    </div>
    <div class="card">
      <div class="hd"><h2>Thu</h2><span class="sum pos" id="incSum"></span></div>
      <div class="ruled"><div id="incomes">${S.incomes.map(incRow).join('')}</div><div id="collects"></div></div>
      <div class="addline"><button class="add" data-act="add-income">Thêm nguồn thu</button><span class="note" id="incHidden"></span></div>
    </div>
    <div class="card">
      <div class="hd"><h2>Chi phí</h2><div class="side"><span class="cap" id="livDay"></span><span class="sum" id="livSum"></span></div></div>
      <div class="ruled" id="living">${S.living.items.map(livRow).join('')}</div>
      <div class="addline"><button class="add" data-act="add-living">Thêm khoản chi</button><span class="note" id="livHidden"></span></div>
    </div>
  </div>
  <div class="card mainc">
    <div class="hd"><div class="side"><h2>Khoản vay</h2>${tabSeg()}</div>
      <div class="side"><span class="cap" id="loanSum"></span><button class="btn pri" data-act="new-loan">${ui.tab === 'lend' ? 'Thêm khoản cho vay' : 'Thêm khoản vay'}</button></div></div>
    <div id="loans"></div>
  </div>
</div>`
};
const tabSeg = () => {
  const nB = S.loans.filter(l => l.dir !== 'lend').length, nL = S.loans.length - nB;
  return seg('tab', [['borrow', `Đi vay ${nB}`], ['lend', `Cho vay ${nL}`]], ui.tab);
};

function render() {
  const keep = { y: scrollY, l: $('#dueList')?.scrollTop || 0 };                       // giữ nguyên vị trí cuộn → không giật
  $('#app').innerHTML = `
<header class="top">
  <span class="brand">Flowsup</span>
  <nav class="tabs" aria-label="Trang">${[['month', 'Tháng này'], ['plan', 'Kế hoạch'], ['data', 'Dữ liệu']].map(([v, t]) =>
    `<button class="tab ${ui.view === v ? 'on' : ''}" data-act="view" data-v="${v}" ${ui.view === v ? 'aria-current="page"' : ''}>${t}</button>`).join('')}</nav>
  <div class="grow"></div>
  <div class="month">
    <button class="ic" data-act="step" data-v="-1" aria-label="Tháng trước">‹</button><b id="selLabel"></b>
    <button class="ic" data-act="step" data-v="1" aria-label="Tháng sau">›</button>
  </div>
  <button class="btn" data-act="export">Xuất file</button>
  <button class="ic" id="moreBtn" popovertarget="menu" aria-label="Thêm thao tác">⋯</button>
  <div id="menu" class="menu" popover>
    <button data-act="import">Nhập file</button>
    <button data-act="demo">Nạp dữ liệu mẫu</button>
    <button class="danger" data-act="reset">Xoá hết</button>
  </div>
</header>
${loadErr ? `<div class="banner bad"><b>${loadErr}</b><span>Mọi thay đổi lúc này sẽ không được lưu.</span></div>` : ''}
${isEmpty() ? `<div class="banner"><span><b>Chưa có dữ liệu.</b> Vào Dữ liệu để nhập số dư, thu, chi phí và khoản vay.</span>
  <button class="btn pri" data-act="demo">Xem dữ liệu mẫu</button></div>` : ''}
<main id="view">${VIEWS[ui.view]()}</main>
<footer class="foot"><span id="autoState">${esc(autoState)}</span><span>© derekdaydoi</span></footer>`;
  ro?.disconnect(); ro = null;
  if (ui.view === 'month') { ro = new ResizeObserver(() => cur && dayChart(cur)); ro.observe($('#day')); }
  draw();
  if ($('#dueList')) $('#dueList').scrollTop = keep.l;
  if (scrollY !== keep.y) scrollTo(0, keep.y);
}

/* ----- Phần kết quả (vẽ lại sau mỗi lần gõ) ----- */
function draw() {
  const P = D.project(S), m = cur = P.find(x => x.k === S.sel) || D.past(S).find(x => x.k === S.sel) || P[0];
  const loans = S.loans.map(l => {
    const sc = D.schedule(l);
    return { l, sc, at: D.loanAt(l, m.k, sc), lq: D.liquidity(l, sc), ev: D.loanEvents(l, m.k, sc).filter(e => e.cat === 'principal' || e.cat === 'interest' || e.cat === 'collect') };
  });
  $('#selLabel').textContent = mLong(m.k);
  if (ui.view === 'month') { drawLow(m); drawDue(m); dayChart(m); }
  else if (ui.view === 'plan') { drawMonths(P, m); drawPos(P, m); drawPayoff(m, loans); }
  else { drawBal(m); drawFrame(m, loans); drawLoans(m, loans); }
}

const isLend = o => o.l.dir === 'lend';
const ddmm = (d, k) => `${D.pad(d)}/${k.slice(5)}`;

/* Tháng này: số dư thấp nhất là con số lớn nhất; phép tính một dòng đầu kỳ + vào − ra = cuối tháng. */
function drawLow(m) {
  const negDays = m.days.filter(d => Math.round(d.end) < 0).length, lo = m.low.end;
  const pills = [`<span class="pill ${lo < 0 ? 'neg' : ''}">Ngày ${m.low.day}/${+m.k.slice(5)}</span>`,
    negDays ? `<span class="pill neg">${negDays} ngày âm</span>` : '<span class="pill in">Không có ngày âm</span>',
    lo < 0 && !m.past ? `<span class="pill" data-tip="Số tiền cần có thêm từ ${m.from > 1 ? 'ngày ' + m.from : 'đầu tháng'} để không ngày nào bị âm">Cần thêm ${short(-lo)}</span>` : '',
    m.diff != null ? `<span class="pill" data-tip="${esc(`Chốt ngày ${m.from}: ${money(m.check.amount)}\nKhung dự tính: ${money(m.expect)}\nLệch = chốt − dự tính`)}">Lệch chốt ${m.diff > 0 ? '+' : ''}${short(m.diff)}</span>` : '',
    m.past ? '<span class="pill">Đã qua</span>' : ''];
  $('#low').innerHTML = `<span class="cap">${m.from > 1 ? `Thấp nhất từ ngày ${m.from}` : 'Thấp nhất trong tháng'}</span>
    <span class="big ${negOnly(lo)}">${money(lo)}</span><div class="pills">${pills.join('')}</div>`;
  const vin = D.sum(m.events.filter(e => e.value > 0), e => e.value);
  const cashDays = m.dim - m.from + 1, vout = m.end - m.opening - vin;                 // ra = phần còn lại → bốn số khớp từng đồng
  const startCap = m.check ? `Chốt ${ddmm(m.from, m.k)}` : m.zero ? 'Đầu tháng, chưa chốt' : 'Đầu tháng';
  const fig = (cap, val, c = '', tip = '', extra = '') => `<div class="fig ${extra}" ${tip ? `data-tip="${esc(tip)}"` : ''}><span class="cap">${cap}</span><span class="n ${c}">${val}</span></div>`;
  $('#eq').innerHTML = fig(startCap, money(m.opening), negOnly(m.opening), m.zero ? 'Trước lần chốt đầu tiên: tính như đầu tháng có 0đ' : '')
    + fig('Vào', plain(vin), vin ? 'pos' : '', 'Thu + thu hồi cho vay + tiền vay về')
    + fig('Ra', plain(vout), vout < 0 ? 'neg' : '', `Trả nợ + chi phí ${cashDays < m.dim ? cashDays + ' ngày' : 'cả tháng'} + chuyển cho vay`)
    + fig('Cuối tháng', money(m.end), negOnly(m.end), '', 'end')
    + fig('Dư trong tháng', plain(m.free), negOnly(m.free), 'Thu − chi phí − trả nợ, tính cả tháng.\nKhông tính tiền vay về hay chuyển cho vay.');
  $('#dayPills').innerHTML = m.living ? `<span class="pill">Chi phí ${short(m.living / m.dim)}/ngày</span>` : '';
}

/* Đến hạn: mọi khoản rơi vào tháng, gom theo ngày; tick = đã trả / đã thu (chỉ đánh dấu, không đổi khung). */
const evKey = (k, e) => `${k}|${e.id}|${e.cat}|${e.day}`;
function drawDue(m) {
  const box = $('#dueList'), top = box.scrollTop, days = [...new Set(m.events.map(e => e.day))];
  let done = 0;
  box.innerHTML = days.map(d => {
    const evs = m.events.filter(e => e.day === d), net = D.sum(evs, e => e.value);
    return `<div class="dday"><span>${ddmm(d, m.k)}</span><span class="${negOnly(net)}">${plain(net)}</span></div>` + evs.map(e => {
      const key = evKey(m.k, e), on = !!S.paid[key]; done += on;
      const verb = e.value > 0 ? 'Đã thu' : 'Đã trả';
      return `<div class="it ${on ? 'done' : ''}"><button class="tick ${on ? 'on' : ''}" data-act="tick" data-v="${esc(key)}" aria-pressed="${on}" aria-label="${verb} ${esc(e.label)}" data-tip="${verb}">✓</button>
        <span class="nm" data-tip="${esc(e.label + '\n' + signed(e.value))}">${esc(e.label.replace(' · ', ', '))}</span><span class="amt ${e.value > 0 ? 'pos' : ''}">${plain(e.value)}</span></div>`;
    }).join('');
  }).join('') || '<div class="empty" style="margin-top:12px">Không có khoản nào rơi vào tháng này.</div>';
  box.scrollTop = top;
  $('#doneTag').textContent = m.events.length ? `Xong ${done}/${m.events.length}` : 'Trống';
}

/* Kế hoạch: cột = dư trong tháng, đường = số dư cuối tháng. Bấm một cột để xem tháng đó. */
function drawMonths(P, m) {
  const dense = P.length > 12, vals = P.flatMap(x => [x.free, x.end]);
  let lo = Math.min(0, ...vals), hi = Math.max(1, ...vals); const pad = (hi - lo) * .14; hi += pad; if (lo < 0) lo -= pad * .5;
  const pc = v => (v - lo) / (hi - lo) * 100, z = pc(0), n = P.length;
  const cumName = S.carry ? 'Số dư cuối tháng' : 'Đầu tư luỹ kế';
  const col = x => {
    const tip = [mLong(x.k), `Thu ${money(x.income)}`, x.collect && `Thu hồi cho vay ${money(x.collect)}`,
      `Chi phí ${money(-x.living)}`, `Trả gốc ${money(-x.principal)}`, `Trả lãi ${money(-x.interest)}`, `Dư trong tháng ${money(x.free)}`,
      x.loanIn && `Tiền vay về +${money(x.loanIn)}`, x.lendOut && `Chuyển cho vay ${money(-x.lendOut)}`,
      `${cumName} ${money(x.cum)}`, x.low.end < 0 && `Thấp nhất ${money(x.low.end)} ngày ${x.low.day}`].filter(Boolean).join('\n');
    const b = x.free >= 0 ? `bottom:${z}%;height:${pc(x.free) - z}%` : `bottom:${pc(x.free)}%;height:${z - pc(x.free)}%`;
    return `<button class="mcol ${x.k === m.k ? 'sel' : ''}" data-act="sel" data-v="${x.k}" data-tip="${esc(tip)}" aria-label="${mLong(x.k)}">
      <i class="bar ${x.free < 0 ? 'neg' : ''}" style="${b}"></i><i class="dot" style="bottom:${pc(x.cum)}%"></i>
      <span class="ev ${negOnly(x.cum)}" style="bottom:${pc(x.cum)}%">${short(x.cum)}</span></button>`;
  };
  const pts = P.map((x, i) => `${(i + .5) / n * 100},${100 - pc(x.cum)}`).join(' ');
  $('#proj').innerHTML = `<div class="${dense ? 'dense' : ''}">
    <div class="mplot">${lo < 0 ? `<i class="mzero" style="bottom:${z}%"></i>` : ''}
      <svg class="mline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polyline points="${pts}"/></svg>
      ${P.map(col).join('')}</div>
    <div class="mlab">${P.map(x => {
      const mo = +x.k.slice(5), lab = mo === 1 ? `1/${x.k.slice(2, 4)}` : (dense ? '' : 'T') + mo;
      return `<span><b>${lab}</b><span class="fv ${negOnly(x.free)}">${x.free > 0 ? '+' : ''}${short(x.free)}</span>${x.low.end < 0 ? `<i data-tip="Có ngày số dư âm">âm</i>` : ''}</span>`;
    }).join('')}</div></div>`;
}

/* Vị thế nợ cuối tháng đang xem. */
function drawPos(P, m) {
  const p = m.pos, cover = P.find(x => x.k >= m.k && x.pos.net > 0 && x.end >= x.pos.net), last = P[P.length - 1];
  const gap = p.net <= 0 ? '<span class="pill in">Cho vay nhiều hơn đi vay</span>'
    : cover ? `<span class="pill in">Số dư đủ lấp từ ${mShort(cover.k)}</span>` : `<span class="pill neg">Đến ${mShort(last.k)} còn thiếu ${short(last.pos.net - last.end)}</span>`;
  const f = (cap, val, c = '', tip = '') => `<div class="pf" ${tip ? `data-tip="${esc(tip)}"` : ''}><span class="cap">${cap}</span><span class="n ${c}">${val}</span></div>`;
  $('#pos').innerHTML = f(`Đang vay, ${p.nB} khoản`, money(p.borrow), '', `Lãi còn phải trả ${money(p.intPay)}`)
    + f(`Cho vay, ${p.nL} khoản`, money(p.lend), p.lend ? 'pos' : '', `Lãi sẽ thu ${money(p.intGet)}`)
    + f(`Trả nợ ${mShort(m.k)}`, money(m.debt), '', `Gốc ${money(m.principal)}\nLãi ${money(m.interest)}\nBằng ${m.inflow ? dec(m.debt / m.inflow * 100, 0) : '—'}% tiền vào`)
    + `<div class="pf main"><span class="cap">Nợ ròng cuối ${mShort(m.k)}</span><span class="n">${money(p.net)}</span>${gap}</div>`;
}

/* Lịch hết nợ / thu về: gom theo năm. Mỗi năm một ô: các khoản xong trong năm đó, ngày xong,
   và mỗi tháng nhẹ đi (hoặc bớt thu) bao nhiêu khi khoản đó kết thúc. */
const usualPay = sc => { const p = sc.rows.map(r => r.pay).sort((a, b) => a - b); return p.length ? p[Math.floor((p.length - 1) / 2)] : 0; };
function drawPayoff(m, loans) {
  const lend = ui.tab === 'lend', list = loans.filter(o => isLend(o) === lend);
  const open = list.filter(o => o.l.open && o.at.state !== 'done'), live = list.filter(o => !o.l.open && o.at.state !== 'done')
    .sort((a, b) => a.sc.end < b.sc.end ? -1 : a.sc.end > b.sc.end ? 1 : 0);
  $('#openPill').innerHTML = open.length ? `<span class="pill" data-tip="${esc(open.map(o => `${o.l.label}  ${money(o.l.principal)}`).join('\n'))}">Chưa hẹn ngày: ${open.length} khoản, ${short(D.sum(open, o => o.l.principal))}</span>` : '';
  if (!live.length) return $('#payoff').innerHTML = `<div class="empty">${lend ? 'Không có khoản cho vay nào đang chạy.' : 'Không có khoản vay nào đang chạy.'}</div>`;
  const years = [...new Set(live.map(o => o.sc.end.slice(0, 4)))];
  $('#payoff').innerHTML = `<div class="yrs">${years.map(y => {
    const ls = live.filter(o => o.sc.end.startsWith(y)), freed = D.sum(ls, o => usualPay(o.sc));
    return `<div class="yr"><div class="yhd"><b>${y}</b><span class="pill ${lend ? '' : 'in'}" data-tip="${lend ? 'Tiền thu hằng tháng sẽ giảm chừng này khi các khoản dưới đây kết thúc' : 'Tiền trả hằng tháng sẽ nhẹ đi chừng này khi các khoản dưới đây kết thúc'}">${lend ? 'Bớt thu' : 'Nhẹ đi'} ${short(freed)}/tháng</span></div>
      ${ls.map(({ l, sc, at }) => `<button class="yi" data-act="edit-loan" data-v="${l.id}"
        data-tip="${esc(`${l.label}\nĐáo hạn ${dLabel(sc.end)}, đã ${at.paid}/${sc.term} kỳ\n${lend ? 'Còn phải thu' : 'Còn lại'} ${money(at.state === 'future' ? l.principal : at.balance)}\nMỗi tháng ${money(usualPay(sc))}`)}">
        <span class="nm">${esc(l.label)}</span><span class="dt">${sc.end.slice(8)}/${sc.end.slice(5, 7)}</span><span class="amt">${short(usualPay(sc))}</span></button>`).join('')}</div>`;
  }).join('')}</div>`;
}

/* Dữ liệu: ô chốt đi theo tháng đang xem. Tháng đã chốt thì sửa số chốt của tháng đó; chưa chốt thì gõ số là chốt mới. */
const chkOf = k => S.checks.find(c => c.date.slice(0, 7) === k);
function drawBal(m) {
  const c = m.check, amt = $('#opening'), date = $('#openDate');
  $('.bal').classList.toggle('unset', !c);
  $('#balCap').textContent = c ? `Chốt ${mShort(m.k)}` : `Chưa chốt ${mShort(m.k)}`;
  $('#unchk').hidden = !c || S.checks.length < 2;
  if (document.activeElement !== amt) amt.value = c ? sign(c.amount) + nf.format(Math.abs(c.amount)) : '';
  amt.placeholder = c ? '0' : m.zero ? '0' : nf.format(Math.round(m.opening));
  if (document.activeElement !== date) date.value = c ? c.date : ui.pend[m.k] || m.k + '-01';
  $('#balNote').innerHTML = c && m.expect != null
    ? `Khung dự tính <b>${short(m.expect)}</b>, lệch <b class="${negOnly(m.diff)}">${m.diff > 0 ? '+' : ''}${short(m.diff)}</b>`

/* Vẽ theo đúng số pixel đang có → chữ không bị kéo giãn khi đổi cỡ cửa sổ hay thu phóng. */
function dayChart(m) {
  const svg = $('#day'); if (!svg) return; const W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const n = m.dim, d0 = m.from - 1, span = Math.max(1, n - d0);
  const l = 52, r = 10, t = 10, b = 24;
  const P = [[d0, m.opening], ...m.days.map(d => [d.day, d.end])], vals = P.map(p => p[1]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); if (hi === lo) hi = lo + 1;
  const pad = (hi - lo) * .1; hi += pad; if (lo < 0) lo -= pad;
  const x = p => +(l + (p - d0) / span * (W - l - r)).toFixed(1), y = v => +(t + (hi - v) / (hi - lo) * (H - t - b)).toFixed(1), y0 = y(0);
  const pts = P.map(([p, v]) => `${x(p)},${y(v)}`), area = `M${x(d0)},${y0}L${pts.join('L')}L${x(n)},${y0}Z`;
  const raw = (hi - lo) / 4, mag = 10 ** Math.floor(Math.log10(raw)), step = [1, 2, 2.5, 5, 10].map(k => k * mag).find(s => s >= raw);
  const gv = []; for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) gv.push(Math.abs(v) < step / 1e6 ? 0 : v);   // mốc tròn, luôn có 0
  const grid = gv.filter(v => v !== 0).map(v =>
    `<line class="g-grid" x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}"/><text x="${l - 8}" y="${y(v) + 4}" text-anchor="end">${short(v)}</text>`).join('');
  const part = (id, k) => `<g clip-path="url(#${id})"><path d="${area}" class="g-${k}"/><polyline points="${pts.join(' ')}" class="l-${k}"/></g>`;
  const dots = m.days.filter(d => d.rows.length && d !== m.low).map(d => `<circle class="d-ev" cx="${x(d.day)}" cy="${y(d.end)}" r="3"/>`).join('');
  const cand = W < 420 ? [10, 20] : [5, 10, 15, 20, 25];
  const ticks = [m.from, ...cand.filter(d => d > m.from + 1 && d < n - 1), n].map(d =>
    `<text x="${x(d)}" y="${H - 6}" text-anchor="middle">${d}</text>`).join('');
  const hover = m.days.map(d => {
    const tip = `Ngày ${d.day}/${+m.k.slice(5)}, cuối ngày ${money(d.end)}` + d.rows.map(e => `\n${signed(e.value)}  ${e.label}`).join('');
    return `<rect class="hit" x="${x(d.day - 1)}" y="${t}" width="${Math.max(1, x(d.day) - x(d.day - 1))}" height="${H - t - b}" data-tip="${esc(tip)}"/>`;
  }).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><clipPath id="up"><rect width="${W}" height="${y0}"/></clipPath>
      <clipPath id="dn"><rect y="${y0}" width="${W}" height="${Math.max(0, H - y0)}"/></clipPath></defs>
    ${grid}<line class="g-zero" x1="${l}" x2="${W - r}" y1="${y0}" y2="${y0}"/><text x="${l - 8}" y="${y0 + 4}" text-anchor="end">0</text>
    ${part('up', 'up')}${part('dn', 'dn')}${dots}
    <circle class="d-low ${m.low.end < 0 ? '' : 'ok'}" cx="${x(m.low.day)}" cy="${y(m.low.end)}" r="5"/>
    ${ticks}${hover}`;
}

function spark(sc) {
  const max = Math.max(1, ...sc.rows.map(r => r.pay)), bar = (v, c) => `<i style="height:${v / max * 100}%;background:var(--${c})"></i>`;
  return `<div class="spark">${sc.rows.map(r => `<span>${bar(r.interest, 'in-mid')}${bar(r.principal, 'ink')}</span>`).join('')}</div>`;
}

/* ----- Sự kiện ----- */
function fmtInput(el, allowNeg) {                                                    // gõ số có dấu chấm ngăn nghìn, giữ vị trí con trỏ
  const neg = allowNeg && /^\s*[-−]/.test(el.value);
  const before = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
  const d = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
  el.value = (neg ? '−' : '') + (d ? nf.format(+d) : '');
  let i = neg ? 1 : 0, c = 0; while (c < before && i < el.value.length) { if (/\d/.test(el.value[i])) c++; i++; }
  el.setSelectionRange(i, i); return (neg ? -1 : 1) * (+d || 0);
}

function loanInput(el, f, v) {
  if (!f) return;
  const d = draft, ok = !loanErr(d) && !d.open, n = ok ? D.dates(d).length : 0, reg = ok && d.end === D.addM(d.first, n - 1);
  if (f === 'start') {
    if (!D.dOK(v)) return;
    const autoFirst = d.first === D.addM(d.start, 1); d.start = v;
    if (autoFirst && !d.open) { d.first = D.addM(v, 1); setVal('first', d.first); if (reg) { d.end = D.addM(d.first, n - 1); setVal('end', d.end); } }
  }
  else if (f === 'first') { if (!D.dOK(v)) return; d.first = v; if (reg) { d.end = D.addM(v, n - 1); setVal('end', d.end); } }
  else if (f === 'end') { if (!D.dOK(v)) return; d.end = v; }
  else if (f === 'term') { if (!v || !D.dOK(d.first)) return; d.end = D.addM(d.first, int(v, 1, 360) - 1); setVal('end', d.end); }
  else if (f === 'open') { d.open = el.checked; if (!d.open && !(d.end >= d.first)) { d.first = D.addM(d.start, 1); d.end = d.first; } return paintLoan(); }
  else d[f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +v || 0 : v;
  meta(); preview();
}

/* ----- Sự kiện ----- */
function fmtInput(el, allowNeg) {                                                    // gõ số có dấu chấm ngăn nghìn, giữ vị trí con trỏ
  const neg = allowNeg && /^\s*[-−]/.test(el.value);
  const before = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
  const d = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
  el.value = (neg ? '−' : '') + (d ? nf.format(+d) : '');
  let i = neg ? 1 : 0, c = 0; while (c < before && i < el.value.length) { if (/\d/.test(el.value[i])) c++; i++; }
  el.setSelectionRange(i, i); return (neg ? -1 : 1) * (+d || 0);
}

function loanInput(el, f, v) {
  if (!f) return;
  const d = draft, ok = !loanErr(d) && !d.open, n = ok ? D.dates(d).length : 0, reg = ok && d.end === D.addM(d.first, n - 1);
  if (f === 'start') {
    if (!D.dOK(v)) return;
    const autoFirst = d.first === D.addM(d.start, 1); d.start = v;
    if (autoFirst && !d.open) { d.first = D.addM(v, 1); setVal('first', d.first); if (reg) { d.end = D.addM(d.first, n - 1); setVal('end', d.end); } }
  }
  else if (f === 'first') { if (!D.dOK(v)) return; d.first = v; if (reg) { d.end = D.addM(v, n - 1); setVal('end', d.end); } }
  else if (f === 'end') { if (!D.dOK(v)) return; d.end = v; }
  else if (f === 'term') { if (!v || !D.dOK(d.first)) return; d.end = D.addM(d.first, int(v, 1, 360) - 1); setVal('end', d.end); }
  else if (f === 'open') { d.open = el.checked; if (!d.open && !(d.end >= d.first)) { d.first = D.addM(d.start, 1); d.end = d.first; } return paintLoan(); }
  else d[f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +v || 0 : v;
  meta(); preview();
}

document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f, v = el.classList.contains('money') ? fmtInput(el, el.id === 'opening') : el.value;
  if (el.closest('dialog')) return loanInput(el, f, v);
  if (el.id === 'opening' || el.id === 'openDate') {                                     // chốt tháng: chỉ đụng tới lần chốt của đúng tháng đó
    const c = chkOf(S.sel);
    if (el.id === 'opening') {
      if (c) c.amount = v; else S.checks.push({ date: ui.pend[S.sel] || S.sel + '-01', amount: v });
    } else {
      if (!D.dOK(v)) return;
      const k = v.slice(0, 7);
      if (!c) { ui.pend[k] = v; S.sel = k; save(); return draw(); }                     // chưa có số: nhớ ngày, chờ gõ số
      const other = chkOf(k); if (other && other !== c) S.checks.splice(S.checks.indexOf(other), 1);
      c.date = v; S.sel = k;
    }
    syncChecks(S);
  }
  else {
    const row = el.closest('.rw'); if (!row) return;
    const x = (row.closest('#incomes') ? S.incomes : S.living.items).find(o => o.id === row.dataset.id); if (!x) return;
    x[f] = f === 'day' ? int(v || 1, 1, 31) : f === 'from' || f === 'until' ? month(v) : v;
  }
  save(); draw();
});

/* Mỗi nút một hành động. false = không làm gì thêm; 'soft' = lưu + chỉ vẽ lại số liệu (không dựng lại trang → không giật). */
const rowId = el => el.closest('.rw').dataset.id;
const ACT = {
  view: v => { ui.view = v; try { localStorage.setItem(VKEY, v); } catch {} scrollTo(0, 0); },
  sel: v => { S.sel = v; return 'soft'; },
  step: v => { const k = D.shift(S.sel, +v); if (k >= (D.past(S)[0]?.k || S.start) && k <= D.shift(S.start, S.horizon - 1)) S.sel = k; return 'soft'; },
  unchk: () => { const c = chkOf(S.sel); if (!c || S.checks.length < 2) return false; S.checks.splice(S.checks.indexOf(c), 1); syncChecks(S); return 'soft'; },
  tick: v => { if (S.paid[v]) delete S.paid[v]; else S.paid[v] = true; return 'soft'; },
  carry: v => { S.carry = v === '1'; },
  horizon: v => { S.horizon = +v; },
  tab: v => { ui.tab = v; },
  'add-income': () => { S.incomes.push({ id: uid(), label: '', amount: 0, day: 1, from: S.sel, until: S.sel }); },   // mặc định: chỉ tháng đang xem
  'add-living': () => { S.living.items.push({ id: uid(), label: '', amount: 0, from: S.sel, until: S.sel }); },
  del: (v, el) => { const id = rowId(el); S.incomes = S.incomes.filter(x => x.id !== id); S.living.items = S.living.items.filter(x => x.id !== id); },
  rec: (v, el) => {                                                                // Hàng tháng → Chỉ tháng đang xem → Khoảng tháng → Hàng tháng
    const id = rowId(el), x = [...S.incomes, ...S.living.items].find(o => o.id === id), r = recOf(x);
    if (r === 'monthly') x.from = x.until = S.sel;
    else if (r === 'once') { x.until = null; ui.open.add(id); }
    else { x.from = x.until = null; ui.open.delete(id); }
  },
  demo: () => { if (!isEmpty() && !confirm('Thay dữ liệu hiện tại bằng dữ liệu mẫu? Nên Xuất file trước.')) return false; S = demo(); toast('Đã nạp dữ liệu mẫu, không phải số thật.'); },
  reset: () => { if (!confirm('Xoá toàn bộ dữ liệu? Nên Xuất file trước.')) return false; S = blank(); loadErr = ''; },
  export: () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportBody()], { type: 'application/json' }));
    a.download = `flowsup-${D.today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return false;
  },
  import: () => { $('#file').click(); return false; },
  'new-loan': () => { openLoan(); return false; },
  'edit-loan': v => { openLoan(v); return false; },
  close: () => { dlg.close(); return false; },
  preset: v => { Object.assign(draft, PRESET[v]); if (v !== 'friend' && draft.basis === 'none') draft.basis = 'flat'; paintLoan(); return false; },
  'save-loan': () => {
    const err = loanErr(draft); if (err) { $('#err').textContent = err; return false; }
    draft.label = draft.label.trim() || (draft.dir === 'lend' ? 'Khoản cho vay' : 'Khoản vay'); delete draft.note;
    const i = S.loans.findIndex(x => x.id === draft.id); if (i < 0) S.loans.push(draft); else S.loans[i] = draft;
    ui.tab = draft.dir; dlg.close();
  },
  'del-loan': () => { if (!confirm(`Xoá "${draft.label}"?`)) return false; S.loans = S.loans.filter(x => x.id !== draft.id); dlg.close(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (el.closest('#menu')) $('#menu').hidePopover?.();
  if (act.startsWith('set-')) { draft[act.slice(4)] = v; return paintLoan(); }             // các nút chọn trong hộp khoản vay
  const r = ACT[act]?.(v, el); if (r === false || !ACT[act]) return;
  if (r === 'soft') { save(); return draw(); }
  S = norm(S); save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches?.('tr[data-act]')) e.target.click(); });
/* Menu ⋯ mở ngay dưới nút, căn phải. */
document.addEventListener('toggle', e => {
  if (e.target.id !== 'menu' || e.newState !== 'open' || CSS.supports('anchor-name: --a')) return;
  const b = $('#moreBtn').getBoundingClientRect(), m = e.target;
  m.style.top = Math.min(innerHeight - m.offsetHeight - 8, b.bottom + 6) + 'px';
  m.style.left = Math.max(8, b.right - m.offsetWidth) + 'px';
}, true);

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const raw = JSON.parse(await f.text()); let next, note = 'Đã nhập file.';
    if (raw?.format === 'rootcash-desktop' && raw.data) next = norm(raw.data);
    else if (raw?.format === 'rootcash-backup' && raw.data?.items) {
      const r = fromV2(raw.data); next = r.data;
      note = `Đã chuyển từ Rootcash webapp. Các khoản trả nợ cần bổ sung gốc, lãi${r.skipped ? `; bỏ qua ${r.skipped} khoản chi một lần` : ''}.`;
    }
    else throw 0;
    if (!isEmpty() && !confirm('Thay toàn bộ dữ liệu hiện tại bằng file này?')) return;
    S = next; loadErr = ''; save(); render(); toast(note);
  } catch { toast('File không phải bản sao lưu hợp lệ.'); }
});

const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest?.('[data-tip]'); if (!el) return tip.textContent = '';
  tip.textContent = el.dataset.tip; const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX + 14)) + 'px';
  tip.style.top = (e.clientY + h + 24 > innerHeight ? e.clientY - h - 12 : e.clientY + 18) + 'px';
});
document.addEventListener('scroll', () => tip.textContent = '', { capture: true, passive: true });
render();
/* Mở lên mà app trống (máy mới, hồ sơ bị xoá…) → tự lấy lại bản tự lưu gần nhất; ngược lại lưu ngay một bản. */
if (AUTO) (async () => {
  if (isEmpty() && !loadErr) try {
    const r = await fetch(autoUrl('latest'));
    if (r.ok) { const raw = await r.json(); if (raw?.data) { S = norm(raw.data); save(); render(); toast('Đã khôi phục từ bản tự lưu gần nhất.'); return; } }
  } catch {}
  autoSave(true);
})();
})();
</script>
