:root{
  --bg:#E4E8E2; --card:#fff; --field:#F3F5F1; --line:#D9DED6; --line2:#C3CBC1; --ink:#15211B; --mut:#66736C;
  --brand:#103D2F; --brand2:#1B4D3D; --pos:#167A55; --mint:#E2EFE7; --neg:#C2412D; --negbg:#F7E6E2;

*{box-sizing:border-box}
html{font:clamp(14px,.3vw + 10.8px,16.5px)/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);

body{margin:0 auto;max-width:112rem;padding:1rem clamp(1rem,2vw,2rem) 1.5rem}
h1,h2,p{margin:0}

h2{font-size:1rem}

button{cursor:pointer}
input{outline:0;border-radius:var(--rc);padding:.3rem .5rem;width:100%;font-weight:500}
:focus-visible{outline:2px solid var(--pos);outline-offset:1px}
b{font-weight:600}
.n{font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
input.money{font-variant-numeric:tabular-nums}
small,.mut{color:var(--mut);font-size:.8rem;font-weight:400}
.pos{color:var(--pos)} .neg{color:var(--neg)}
/* Nhãn: chữ thường, không giãn chữ — một kiểu duy nhất cho mọi tiêu đề thẻ/cột */
.cap{font-size:.84rem;font-weight:550}
.sec .cap{font-size:.92rem;font-weight:650;color:var(--ink)}
.sw{display:inline-block;width:.65rem;height:.65rem;border-radius:.2rem;margin-right:.45rem;vertical-align:-.03rem;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:1.1rem 1.2rem;min-width:0}
.card>header{display:flex;justify-content:space-between;align-items:center;gap:.6rem 1rem;flex-wrap:wrap;margin-bottom:.9rem;min-height:2rem}
.card>header small{display:block}
.pbody>header{margin-bottom:.8rem}
.side{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.one{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
::-webkit-scrollbar{width:8px;height:8px} ::-webkit-scrollbar-thumb{background:#C9D1CA;border-radius:8px} ::-webkit-scrollbar-track{background:transparent}

/* thanh trên */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:1rem;margin-bottom:var(--gap)}
.brand{display:flex;align-items:center;gap:.6rem;font-size:1.15rem;font-weight:700;letter-spacing:-.02em;color:var(--brand)}
.brand img{width:2rem;height:2rem}
.acts{justify-self:end}
.btn{height:2.1rem;padding:0 .9rem;border-radius:var(--rc);background:var(--card);font-weight:500;font-size:.84rem;border:1px solid var(--line)}
.btn:hover{border-color:var(--line2)}
.btn.pri{background:var(--brand);color:#fff;border-color:var(--brand)} .btn.pri:hover{background:var(--brand2)}
.btn.danger{color:var(--neg);border-color:transparent;background:none} .btn.danger:hover{background:var(--negbg)}
.seg{display:inline-flex;background:var(--field);border:1px solid var(--line);border-radius:.6rem;padding:.15rem;gap:.1rem;flex-wrap:wrap}
.seg button{height:1.75rem;padding:0 .75rem;border-radius:.45rem;font-size:.82rem;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:550;box-shadow:0 0 0 1px var(--line)}
.nav{display:flex;align-items:center;gap:.3rem;background:var(--card);border:1px solid var(--line);border-radius:.7rem;padding:.2rem}
.nav h1{font-size:1.05rem;min-width:9em;text-align:center}
.nav button{width:2rem;height:2rem;border-radius:var(--rc);font-size:1.05rem;color:var(--mut)}
.nav button:hover{background:var(--field);color:var(--ink)}
.banner{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap;background:var(--mint);border-radius:var(--r);padding:.7rem 1rem;margin-bottom:var(--gap);font-size:.9rem}
.banner.bad{background:var(--negbg);color:var(--neg)}

/* bố cục kiểu app: thanh trên đứng yên, Khung (trái) và bảng điều khiển (phải) cuộn riêng → Free float luôn ở đáy Khung */
.app{display:grid;grid-template-columns:minmax(23rem,27rem) minmax(0,1fr);gap:var(--gap);align-items:start}
.panel{padding-bottom:0}
.dash{display:grid;gap:var(--gap);min-width:0;container-type:inline-size;align-content:start}
@media (min-width:76.01rem){
  html{overflow:hidden;height:100%} body{height:100%;display:flex;flex-direction:column;padding-bottom:0}
  #app{flex:1;min-height:0;display:flex;flex-direction:column}
  .app{flex:1;min-height:0;align-items:stretch}
  .panel{display:flex;flex-direction:column;overflow:hidden;min-height:0;padding:0}
  .pbody{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;padding:1.1rem .9rem .8rem 1.2rem}
  .panel .sum{flex:none;margin:0;padding:.85rem 1.2rem 1rem}
  .dash{overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;min-height:0}
  .dash{padding:0 .3rem 1rem 0;margin-right:-.3rem}
}
@media (max-width:76rem){.app{grid-template-columns:1fr}}
@media (max-width:44rem){.top{grid-template-columns:1fr auto}.top .nav{grid-column:1/-1;grid-row:2;justify-self:center}}

/* Khung */
.bal{background:var(--field);border:1px solid var(--line);border-radius:.7rem;padding:.75rem .85rem;display:grid;gap:.3rem}
.bal input.money{font-size:1.6rem;font-weight:700;padding:0;background:none;letter-spacing:-.02em}
.when{display:flex;align-items:center;gap:.5rem;font-size:.8rem;color:var(--mut);white-space:nowrap}
.when input{background:#fff;border:1px solid var(--line);width:auto;flex:1;color:var(--ink);padding:.2rem .5rem}
.balhd{display:flex;align-items:center;justify-content:space-between;min-height:1.4rem}
.bal.unset input.money{color:var(--mut)}
.bnote{font-size:.78rem;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:1.1em}
.bnote b{color:var(--ink);font-weight:600}.bnote b.neg{color:var(--neg,#C2412D)}
.mode{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:.75rem 0 .1rem;font-size:.8rem;flex-wrap:wrap}
.sec,.sum{display:flex;align-items:center;gap:.5rem;margin-top:.95rem;padding-top:.8rem;border-top:1px solid var(--line)}
.sec input.money{width:8em;text-align:right;font-weight:650;background:var(--field)}
.dots{flex:1;min-width:.6rem;border-bottom:1px dashed var(--line2);align-self:end;margin-bottom:.45em}
.rows{display:grid;gap:.15rem;margin-top:.4rem}
.row{display:grid;grid-template-columns:minmax(3.5rem,1fr) auto auto 7.6em auto;align-items:center;gap:.25rem;border-radius:var(--rc);padding:.1rem 0 .1rem .45rem;min-height:2.1rem}
.row.liv{grid-template-columns:minmax(3.5rem,1fr) auto 7.6em auto}
.row.due{grid-template-columns:auto minmax(0,max-content) 1fr auto;width:100%;text-align:left;padding:.3rem .5rem;gap:.5rem}
.row.due b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.row:hover,.row:focus-within{background:var(--field)}
.row.off{opacity:.45}
.row input.money{text-align:right;background:var(--field)}
.row:hover input.money,.row input:focus{background:#fff;box-shadow:0 0 0 1px var(--line)}
.row .day{display:flex;align-items:center;gap:.1rem;font-size:.74rem;color:var(--mut)}
.row .day input{width:2.3em;text-align:center;padding:.3rem 0;appearance:textfield}
.row .day input::-webkit-inner-spin-button{display:none}
.row .extra{grid-column:1/-1;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;font-size:.76rem;color:var(--mut);padding:0 .3rem .3rem}
.row .extra input{width:10em;background:#fff;border:1px solid var(--line)}
.dd{min-width:1.7rem;text-align:center;font-size:.72rem;font-weight:600;color:var(--pri);background:var(--prisoft);border-radius:.35rem;padding:.1rem .3rem;font-variant-numeric:tabular-nums}
.dd.in{color:var(--pos);background:var(--mint)}
.rec{font-size:.7rem;font-weight:550;white-space:nowrap;padding:.12rem .45rem;border-radius:.35rem;border:1px solid var(--line);color:var(--mut);background:#fff}
.rec.once{color:var(--liv);border-color:#F0D9AE;background:#FCF5E8} .rec.range{color:var(--pri);border-color:#CAD6F4;background:var(--prisoft)}
.rec:hover{border-color:var(--line2)}
.addline{align-items:center} .addline span{padding-right:.5rem}
.row[hidden]{display:none}
.ic{width:1.6rem;height:1.6rem;border-radius:.4rem;color:var(--mut);line-height:1}
.ic:hover{background:#fff;color:var(--ink)} .ic.on{color:var(--pos);background:var(--mint)}
.add{margin:.3rem 0 0 .45rem;font-size:.8rem;font-weight:500;color:var(--pos);padding:.2rem .6rem;border-radius:.4rem}
.add:hover{background:var(--mint)}
.info{display:flex;justify-content:space-between;gap:.5rem;font-size:.78rem;color:var(--mut)}
.info b{font-weight:500}
.link{color:var(--pos);font-weight:500;font-size:.78rem}
.link:hover{text-decoration:underline}
.note{margin:.35rem .5rem 0;font-size:.78rem;color:var(--mut)} .note b{color:var(--ink);font-weight:500}
.sum{background:var(--field);border-top:1px solid var(--line);border-radius:0 0 var(--r) var(--r);justify-content:space-between;padding:.8rem 0 1rem;margin-top:1rem}
.sum b{font-weight:650;font-size:.95rem} .sum .n{font-size:1.4rem;letter-spacing:-.02em}

/* dải số chính: thẻ xanh = chỉ Free float; 4 thẻ còn lại là biểu đồ nhỏ */
.figs{display:grid;grid-template-columns:1.35fr repeat(4,minmax(0,1fr));gap:var(--gap)}
.fig{display:flex;flex-direction:column;gap:.45rem;padding:.95rem 1.1rem;min-height:9.5rem}
.fig .n{font-size:1.3rem;letter-spacing:-.02em;line-height:1.2;overflow:hidden;text-overflow:ellipsis}
.fig p{font-size:.78rem;color:var(--mut);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fig p b{font-weight:550;color:var(--ink)}
.hero{background:var(--brand);border-color:var(--brand);color:#fff}
.hero .cap{color:#fff;font-size:.95rem;font-weight:600} .hero small{color:#9FC7B4;margin-top:-.35rem}
.hero .n{margin-top:auto;font-size:clamp(1.7rem,3.1cqi,2.4rem);line-height:1.05;letter-spacing:-.03em} .hero .n.neg{color:#FFB09F}
.leg{display:grid;gap:.2rem;font-size:.78rem;color:var(--mut)} .leg b{color:var(--ink);font-weight:600;margin-left:.2rem}
.leg.row{display:flex;justify-content:space-between;gap:.5rem}
.ringbox{display:flex;align-items:center;gap:.9rem;margin-top:auto}
.ringw{position:relative;width:3.3rem;height:3.3rem;flex:none}
.ring{width:100%;height:100%} .ring circle{fill:none;stroke-width:8} .ring .trk{stroke:var(--mint)} .ring .val{stroke:var(--pri)}
.ringw .n{position:absolute;inset:0;display:grid;place-items:center;font-size:1rem}
.split{display:flex;height:.55rem;border-radius:.2rem;overflow:hidden;gap:2px;background:var(--line)}
.mini{display:flex;align-items:flex-end;gap:1px;height:2.6rem;margin-top:auto}
.mini i{flex:1;background:#BFD9CA;border-radius:1px 1px 0 0;min-height:2px} .mini i.ng{background:#E9A598} .mini i.lo{background:var(--ink)} .mini i.lo.ngl{background:var(--neg)}
.wf{display:flex;gap:.35rem;height:3.4rem;margin-top:auto}
.wf div{flex:1;position:relative}
.wf i{position:absolute;left:0;right:0;border-radius:.15rem;min-height:2px}
.wfl{display:flex;gap:.35rem;font-size:.66rem;color:var(--mut);margin-top:.2rem} .wfl span{flex:1;text-align:center;white-space:nowrap;overflow:hidden}
@container (max-width:62rem){.figs{grid-template-columns:1fr 1fr}.hero{grid-column:1/-1;min-height:7rem}}

/* các tháng tới */
.months,.pos-card{container-type:inline-size}
.cols{display:flex;gap:.2rem}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:.1rem;padding:.4rem .15rem;border-radius:.55rem;text-align:center;font-size:.76rem;border:1px solid transparent}
.col .n{font-weight:600}
.col span{white-space:nowrap;overflow:hidden;line-height:1.4}
button.col:hover{background:var(--field)}
.col.sel{background:var(--field);border-color:var(--line)}
.col .mo{align-self:center;padding:0 .45rem;border-radius:.35rem}
.col.sel .mo{background:var(--brand);color:#fff;font-weight:600}
.col.gut{flex:0 0 4.4rem;text-align:left;color:var(--mut);font-size:.72rem;padding-left:0}
/* Thu = cột mint viền xanh; chi xếp chồng bên trong; mint lộ ra = free float; đỏ nhạt = chi vượt thu */
.bars{height:clamp(8rem,21cqi,11.5rem);display:flex;align-items:flex-end;justify-content:center;position:relative;margin:0 8% .35rem}
.bars .inc{position:absolute;left:0;right:0;bottom:0;background:var(--mint);border-top:2px solid var(--in);border-radius:.25rem .25rem .2rem .2rem}
.bars .gap{position:absolute;left:0;right:0;background:var(--negbg);border-top:2px solid var(--neg);border-radius:.25rem .25rem 0 0}
.stk{position:relative;width:58%;display:flex;flex-direction:column-reverse;border-radius:.2rem;overflow:hidden;gap:1px}
.dip{width:.4rem;height:.4rem;border-radius:50%;background:var(--neg);align-self:center;margin-top:.1rem}
.key{display:flex;gap:.3rem 1.1rem;flex-wrap:wrap;font-size:.76rem;color:var(--mut);margin-top:.6rem}
.sw.inc{background:var(--mint);box-shadow:inset 0 2px 0 var(--in)}
.sw.gap{background:var(--negbg);box-shadow:inset 0 2px 0 var(--neg)}
.sw.dip{border-radius:50%;background:var(--neg);width:.5rem;height:.5rem;vertical-align:.05rem}
.cols.dense{gap:.05rem}
.dense .col{font-size:.64rem;padding-inline:0} .dense .col.gut{flex-basis:3.6rem} .dense .cum{display:none} .dense .bars{margin-inline:4%} .dense .stk{width:66%} .dense .mo{padding:0 .2rem}
@container (max-width:36rem){.cols{gap:.08rem}.col{font-size:.62rem;padding-inline:0}.col.gut{flex-basis:3.3rem;font-size:.62rem}.col .cum{display:none}}

/* trong tháng */
.daycard{container-type:inline-size}
.chips{display:flex;gap:.35rem;flex-wrap:wrap}
.chip{background:var(--field);border:1px solid var(--line);border-radius:.4rem;padding:.15rem .6rem;font-size:.78rem;color:var(--mut);white-space:nowrap}
.chip b{font-weight:550;color:var(--ink);margin-left:.3rem} .chip b.neg{color:var(--neg)}
.tag{font-size:.72rem;font-weight:600;padding:.2rem .6rem;border-radius:.4rem;background:var(--mint);color:var(--pos);white-space:nowrap}
.tag.bad{background:var(--negbg);color:var(--neg)}
.daygrid{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(15rem,1fr);gap:1rem}
#day{display:block;width:100%;height:15rem}
#day text{font-size:.7rem;fill:var(--mut);font-variant-numeric:tabular-nums}
.events{height:15rem;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable;display:flex;flex-direction:column;gap:.15rem}
.evg{flex:none;border-radius:var(--rc);background:var(--field)} .evg.open{box-shadow:inset 0 0 0 1px var(--line)}
.ev{display:grid;grid-template-columns:2.6rem minmax(0,1fr) auto 1.4rem;align-items:center;gap:.5rem;width:100%;text-align:left;font-size:.8rem;padding:.42rem .5rem .42rem .65rem;border-radius:var(--rc);white-space:nowrap}
.ev:hover{background:#EBEFE9}
.ev span:nth-child(2){overflow:hidden;text-overflow:ellipsis}
.pm{font-style:normal;width:1.4rem;height:1.4rem;display:grid;place-items:center;border-radius:.35rem;background:#fff;border:1px solid var(--line);color:var(--mut);font-size:.9rem;line-height:1}
.evbody{padding:0 .65rem .5rem 3.75rem;display:grid;gap:.1rem}
.evcap{display:flex;justify-content:space-between;font-size:.72rem;color:var(--mut);padding:.35rem 1.9rem .1rem 0;border-top:1px solid var(--line)} .evcap b{font-weight:600}
.evd{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.5rem;font-size:.78rem;padding:.12rem 1.9rem .12rem 0;white-space:nowrap}
.evd span:first-child{overflow:hidden;text-overflow:ellipsis}
@container (max-width:44rem){.daygrid{grid-template-columns:1fr}.events{height:auto;max-height:12rem}}

/* vị thế nợ */
.tiles4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem}
.t4{background:var(--field);border:1px solid var(--line);border-radius:.65rem;padding:.7rem .85rem;min-width:0}
.t4 .n{display:block;font-size:1.15rem;margin:.15rem 0 .05rem;overflow:hidden;text-overflow:ellipsis}
.t4 small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t4.dark{background:var(--brand);border-color:var(--brand);color:#fff} .t4.dark .cap,.t4.dark small{color:#9FC7B4}
.gapc{display:flex;gap:.2rem;align-items:flex-end;height:5.5rem;margin-top:.9rem}
.gapc button{flex:1 1 0;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:.25rem;border-radius:.4rem;padding:0 .1rem}
.gapc button:hover{background:var(--field)} .gapc button.sel{background:var(--field)}
.gapc .pr{display:flex;align-items:flex-end;justify-content:center;gap:2px;flex:1}
.gapc .pr i{width:34%;border-radius:.15rem .15rem 0 0;min-height:1px}
.gapc span{font-size:.64rem;color:var(--mut);text-align:center}
@container (max-width:44rem){.tiles4{grid-template-columns:1fr 1fr}}

/* bảng khoản vay: mỗi khoản một dòng, chi tiết khi rê chuột / bấm */
.loans{container-type:inline-size}
#loanSum{white-space:nowrap} #loanSum b{font-weight:550;color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
th{font-size:.8rem;font-weight:550;color:var(--mut);padding:.3rem .9rem .55rem}
td{padding:.75rem .9rem;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
#loans table{table-layout:fixed}
#loans td:first-child{font-weight:550}
#loans tbody tr{cursor:pointer} #loans tbody tr:hover td{background:var(--field)}
tr.off{opacity:.5}
.st{display:inline-block;width:.45rem;height:.45rem;border-radius:50%;margin-right:.6rem;vertical-align:.1rem;background:var(--pri)}
.st.lend{background:var(--in)} .st.future,.st.done{background:#B9C4BD}
.kp{display:inline-flex;align-items:center;gap:.5rem}
.prog{display:inline-block;width:2.6rem;height:.25rem;border-radius:.15rem;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--pri)} .lendtab .prog i{background:var(--in)}
.empty{padding:1.4rem;text-align:center;color:var(--mut);background:var(--field);border-radius:.65rem;font-size:.88rem}
@container (max-width:44rem){
  #loans table,#loans tbody{display:block} #loans thead,#loans colgroup{display:none}
  #loans tr{display:grid;grid-template-columns:1fr auto;gap:.15rem 1rem;padding:.7rem .4rem;border-top:1px solid var(--line)}
  #loans td{border:0;padding:0;background:none!important} #loans td:nth-child(n+3){display:none}
}

/* hộp sửa khoản vay */
dialog{border:1px solid var(--line);border-radius:1rem;padding:0;width:min(68rem,calc(100% - 2rem));max-height:calc(100dvh - 2.5rem);background:var(--bg);color:var(--ink);overscroll-behavior:contain}
dialog::backdrop{background:#103d2f66}
.dhead,.dfoot{position:sticky;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.85rem 1.3rem}
.dhead{top:0;border-bottom:1px solid var(--line)} .dfoot{bottom:0;border-top:1px solid var(--line)}
.dbody{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,25rem),1fr));gap:1.2rem;padding:1.1rem 1.3rem}
.form{display:grid;gap:.85rem;align-content:start}
.form label,.form .lab{display:grid;gap:.3rem;font-size:.78rem;font-weight:500;color:var(--mut)}
.form input:not([type=checkbox]){background:#fff;padding:.5rem .7rem;color:var(--ink);border:1px solid var(--line)}
.form .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:.7rem}
.form .check{display:flex;align-items:center;gap:.55rem;font-weight:400;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:var(--rc);padding:.55rem .7rem}
.form .check input{width:1.05rem;height:1.05rem;flex:none;accent-color:var(--brand)}
.form .hint{font-size:.76rem;color:var(--mut);line-height:1.45}
.metab{background:var(--mint);color:var(--brand);border-radius:var(--rc);padding:.5rem .7rem;font-weight:500;font-size:.84rem}
.rate{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap} .rate input{width:7em!important}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.8rem}
.tile{background:#fff;border:1px solid var(--line);border-radius:.65rem;padding:.65rem .85rem}
.tile b{display:block;font-size:1.08rem;font-weight:650}
.tile.main2{grid-column:1/-1;background:var(--brand);border-color:var(--brand);color:#fff} .tile.main2 small{color:#9FC7B4} .tile.main2 b{font-size:1.65rem}
.spark{display:flex;align-items:flex-end;gap:1px;height:3.4rem}
.spark span{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;border-radius:.1rem;overflow:hidden}
.tbl{max-height:17rem;overflow:auto;border-radius:.65rem;margin-top:.8rem;background:#fff;border:1px solid var(--line);overscroll-behavior:contain}
.tbl table{font-size:.78rem}
.tbl th,.tbl td{padding:.4rem .45rem}
.tbl th{position:sticky;top:0;background:var(--field)}
.err{color:var(--neg);font-size:.84rem;font-weight:500}

#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink);color:#fff;border-radius:.5rem;padding:.45rem .7rem;font-size:.76rem;white-space:pre-line;line-height:1.5;max-width:20rem}
#toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%);background:var(--brand);color:#fff;padding:.6rem 1.1rem;border-radius:.6rem;font-size:.88rem;font-weight:500;z-index:100;max-width:calc(100% - 2rem)}
#tip:empty,#toast:empty{display:none}
footer{margin-top:.2rem;display:flex;justify-content:space-between;gap:.5rem;flex-wrap:wrap;color:var(--mut);font-size:.76rem}
</style>
</head>

<div id="app"></div>
<dialog id="dlg"></dialog>
<input id="file" type="file" accept=".json,application/json" hidden>
<div id="tip"></div><div id="toast" role="status"></div>

<script id="domain">
/* ===== Phần tính toán: hàm thuần, không đụng giao diện. Tiền là số nguyên đồng. ===== */
const D = (() => {
  const pad = n => String(n).padStart(2, '0');
  const sum = (a, f) => a.reduce((t, x) => t + f(x), 0);
  const dim = k => new Date(+k.slice(0, 4), +k.slice(5, 7), 0).getDate();           // số ngày trong tháng
  const mOK = x => /^\d{4}-(0[1-9]|1[0-2])$/.test(x || '');
  const dOK = x => /^\d{4}-(0[1-9]|1[0-2])-(0[1-9]|[12]\d|3[01])$/.test(x || '') && +x.slice(8) <= dim(x.slice(0, 7));
  const shift = (k, n) => {
    const d = new Date(+k.slice(0, 4), +k.slice(5, 7) - 1 + n, 1);
    return d.getFullYear() + '-' + pad(d.getMonth() + 1);
  };
  const dateAt = (k, d) => k + '-' + pad(Math.min(d, dim(k)));                      // ngày 31 → chốt cuối tháng
  const addM = (date, n) => dateAt(shift(date.slice(0, 7), n), +date.slice(8));
  const diff = (a, b) => (+b.slice(0, 4) - +a.slice(0, 4)) * 12 + (+b.slice(5, 7) - +a.slice(5, 7));
  const utc = d => Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8));
  const days = (a, b) => Math.round((utc(b) - utc(a)) / 864e5);                     // số ngày thực tế a → b
  const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };

  /* Các ngày trả: kỳ đầu, rồi mỗi tháng cùng ngày, kỳ cuối = ngày đáo hạn (có thể lẻ ngày). */
  function dates(l) {
    if (l.open) return [];
    const out = [];
    for (let i = 0; i < 361; i++) { const d = addM(l.first, i); if (d >= l.end) break; out.push(d); }
    out.push(l.end);
    return out;
  }

  /* Lịch trả của một khoản — lãi quy về LÃI NGÀY × số ngày thực tế của từng kỳ. Dùng chung cho đi vay và cho vay.
     mode   (gốc):  equal = đều mỗi kỳ | bullet = một lần lúc đáo hạn | annuity = góp đều (gốc+lãi gần cố định)
     basis  (lãi):  none | flat = trên gốc ban đầu | reducing = trên dư nợ | fixed = số tiền cố định/kỳ
                    | total = tổng tiền lãi tuyệt đối, chia theo số ngày của từng kỳ
     timing (lãi):  periodic = mỗi kỳ | upfront = trả trước toàn bộ vào ngày kỳ đầu | end = một lần lúc đáo hạn
     Lãi ngày = lãi năm ÷ 365 (lãi tháng × 12 ÷ 365). Phần lẻ do làm tròn dồn vào kỳ cuối. */
  function schedule(l) {
    if (l.open) {                                                                   // chưa hẹn ngày trả GỐC: gốc không lên lịch, lãi (nếu có) trả hằng tháng từ ngày kỳ đầu
      const rows = [];
      if (l.basis !== 'none') {
        const r = l.basis === 'flat' || l.basis === 'reducing' ? (l.unit === 'year' ? l.rate : l.rate * 12) / 100 / 365 : 0;
        let prev = l.start;
        for (let i = 0; i < 240; i++) {
          const date = addM(l.first, i), dd = Math.max(0, days(prev, date)), acc = r ? Math.round(l.principal * r * dd) : l.fixed;
          rows.push({ i: i + 1, date, days: dd, principal: 0, accrued: acc, interest: acc, pay: acc, after: l.principal });
          prev = date;
        }
      }
      return { rows, total: 0, upfront: 0, end: null, term: 0, span: 0, open: true };
    }
    const ds = dates(l), n = ds.length, P = l.principal, span = days(l.start, l.end);
    const share = d => span > 0 ? Math.round(l.fixed * Math.min(1, d / span)) : l.fixed;   // phần tổng lãi phát sinh sau d ngày
    const rd = l.basis === 'flat' || l.basis === 'reducing' ? (l.unit === 'year' ? l.rate : l.rate * 12) / 100 / 365 : 0;
    const rm = rd * 365 / 12;
    const annuity = l.mode === 'annuity' && l.basis === 'reducing' && l.timing === 'periodic' && rd > 0;
    const A = annuity ? Math.round(P * rm / (1 - (1 + rm) ** -n)) : 0, base = Math.floor(P / n);
    const rows = []; let bal = P, prev = l.start;
    ds.forEach((date, i) => {
      const last = i === n - 1, dd = Math.max(0, days(prev, date)), at = days(l.start, date);
      const accrued = l.basis === 'fixed' ? l.fixed
        : l.basis === 'total' ? (last ? l.fixed : share(at)) - share(at - dd)
        : Math.round((l.basis === 'flat' ? P : bal) * rd * dd);
      const principal = last ? bal : annuity ? Math.min(bal, Math.max(0, A - accrued)) : l.mode === 'bullet' ? 0 : base;
      rows.push({ i: i + 1, date, days: dd, principal, accrued, interest: 0, after: bal -= principal });
      prev = date;
    });
    const total = sum(rows, x => x.accrued); let upfront = 0;
    if (l.timing === 'upfront') rows[0].interest = upfront = total;
    else if (l.timing === 'end') rows[n - 1].interest = total;
    else rows.forEach(x => x.interest = x.accrued);
    rows.forEach(x => x.pay = x.principal + x.interest);
    return { rows, total, upfront, end: l.end, term: n, span };
  }

  /* Áp lực thanh khoản M/x: tiền phải trả kỳ đầu trên mỗi đồng gốc. */
  function liquidity(l, sc = schedule(l)) {
    if (!sc.rows.length) return null;
    const f = sc.open ? sc.rows[1] || sc.rows[0] : sc.rows[0], peak = sc.rows.reduce((a, b) => b.pay > a.pay ? b : a);   // chưa hẹn ngày: lấy kỳ thường
    return { p: f.principal / l.principal, i: f.interest / l.principal, rate: f.pay / l.principal, peak, first: f };
  }

  /* Dòng tiền của một khoản trong tháng k. Đi vay: trả gốc/lãi (−). Cho vay: thu gốc/lãi (+).
     Tiền giải ngân (nhận vay / chuyển cho vay) chỉ đổi số dư, KHÔNG phải free float. */
  function loanEvents(l, k, sc = schedule(l)) {
    const ev = [], lend = l.dir === 'lend', s = lend ? 1 : -1;
    const add = (date, value, cat, note) => ev.push({ day: +date.slice(8), value, cat, id: l.id, label: l.label + ' · ' + note });
    if (l.disburse && l.start.slice(0, 7) === k) add(l.start, -s * l.principal, lend ? 'lendOut' : 'loanIn', lend ? 'chuyển cho vay' : 'nhận vay');
    for (const r of sc.rows) if (r.date.slice(0, 7) === k) {
      const v = lend ? 'thu' : '';
      if (r.principal) add(r.date, s * r.principal, lend ? 'collect' : 'principal', `${v ? 'thu ' : ''}gốc kỳ ${r.i}/${sc.term}`);
      if (r.interest) add(r.date, s * r.interest, lend ? 'collect' : 'interest', sc.upfront ? `${v ? 'thu ' : ''}lãi trả trước` : sc.open ? `${v ? 'thu ' : ''}lãi tháng ${+r.date.slice(5, 7)}` : `${v ? 'thu ' : ''}lãi kỳ ${r.i}/${sc.term}`);
    }
    return ev;
  }

  /* Trạng thái khoản tính đến hết tháng k. */
  function loanAt(l, k, sc = schedule(l)) {
    if (l.open) return { state: l.start.slice(0, 7) > k ? 'future' : 'live', paid: 0, balance: l.principal };
    const paid = sc.rows.filter(r => r.date.slice(0, 7) <= k);
    const state = l.start.slice(0, 7) > k ? 'future' : sc.end.slice(0, 7) < k ? 'done' : 'live';
    return { state, paid: paid.length, balance: l.principal - sum(paid, r => r.principal) };
  }

  /* Vị thế nợ cuối tháng k: đang vay, cho vay, lãi còn lại hai chiều. */
  function position(s, k) {
    const r = { borrow: 0, lend: 0, intPay: 0, intGet: 0, nB: 0, nL: 0 };
    for (const l of s.loans) {
      const sc = schedule(l), at = loanAt(l, k, sc);
      if (at.state === 'future' || at.balance <= 0) continue;
      const left = sc.open ? 0 : sum(sc.rows.filter(x => x.date.slice(0, 7) > k), x => x.interest);   // chưa hẹn ngày: không biết lãi còn bao nhiêu
      if (l.dir === 'lend') { r.lend += at.balance; r.intGet += left; r.nL++; } else { r.borrow += at.balance; r.intPay += left; r.nB++; }
    }
    r.net = r.borrow - r.lend;
    return r;
  }

  const activeIn = (x, k) => (!x.from || x.from <= k) && (!x.until || k <= x.until);

  /* Một tháng có hai lớp tách bạch:
     • KHUNG (kế hoạch, luôn đủ tháng): FREE FLOAT = Thu + Thu hồi cho vay − Chi phí − Trả nợ (không tính tiền giải ngân).
     • SỐ DƯ (tiền mặt): chạy từ ngày `from` (tháng đầu = ngày nhập số dư) với các dòng tiền từ ngày đó trở đi;
       chi phí trải đều mỗi ngày. Số dư nhập vào không được dùng để suy ra khung. */
  function month(s, k, opening, from = 1) {
    const n = dim(k), all = [];
    for (const x of s.incomes) if (x.amount && activeIn(x, k))
      all.push({ day: Math.min(x.day, n), value: x.amount, cat: 'income', id: x.id, label: x.label || 'Thu' });
    for (const l of s.loans) all.push(...loanEvents(l, k));
    all.sort((a, b) => a.day - b.day);
    const ev = all.filter(e => e.day >= from), t = c => sum(all.filter(e => e.cat === c), e => e.value);
    const income = t('income'), collect = t('collect'), loanIn = t('loanIn'), lendOut = 0 - t('lendOut');
    const principal = 0 - t('principal'), interest = 0 - t('interest');                // 0 − x: tránh hiện "−0"
    const L = sum(s.living.items.filter(x => activeIn(x, k)), x => x.amount), living = L;   // chi phí tháng = các khoản thuộc tháng k
    const free = income + collect - living - principal - interest;
    let num = opening * n; const ds = [];                                             // tử số nguyên → cuối tháng khớp từng đồng
    for (let d = from; d <= n; d++) {
      const rows = ev.filter(e => e.day === d);
      num += sum(rows, e => e.value) * n - L;
      ds.push({ day: d, end: num / n, rows });
    }
    const low = ds.reduce((a, b) => b.end < a.end ? b : a);
    return { k, dim: n, from, opening, income, collect, inflow: income + collect, loanIn, lendOut, living, principal, interest,
      debt: principal + interest, free, end: num / n, days: ds, low, events: ev };
  }

  /* Chốt tháng: mỗi tháng giữ một số dư chốt riêng { date, amount }. Lần chốt mới nhất là "hiện tại".
     • Tháng có chốt: tiền mặt chạy từ ngày chốt; expect = số dư dự tính tại ngày đó theo khung → lệch = chốt − dự tính.
     • Tháng không chốt: nối tiếp số dư cuối tháng trước.
     • Trước lần chốt đầu tiên (zero): không biết số dư nên tính từ 0đ đầu tháng (cuối tháng = free float).
     Tương lai: carry = free float dồn sang tháng sau; ngược lại mỗi tháng bắt đầu lại từ số dư chốt, cum = free float luỹ kế. */
  const checks = s => s.checks?.length ? s.checks : [{ date: s.openDate, amount: s.opening }];
  function timeline(s) {
    const C = [...checks(s)].sort((a, b) => a.date < b.date ? -1 : 1), last = C[C.length - 1], k0 = last.date.slice(0, 7);
    const ks = [...s.incomes, ...s.living.items].map(x => x.from).concat(s.loans.map(l => l.start.slice(0, 7)), C.map(c => c.date.slice(0, 7))).filter(Boolean);
    const first = ks.reduce((a, b) => a < b ? a : b), min = shift(k0, -24), out = [];
    let bal = null, cum = 0;
    for (let k = first < min ? min : first; k <= shift(k0, s.horizon - 1); k = shift(k, 1)) {
      const c = C.find(x => x.date.slice(0, 7) === k), fut = k > k0, d = c ? +c.date.slice(8) : 1;
      let m;
      if (c) {
        m = month(s, k, c.amount, d); m.check = c;
        if (bal !== null && !out[out.length - 1].zero) { m.expect = d === 1 ? bal : month(s, k, bal, 1).days[d - 2].end; m.diff = c.amount - m.expect; }
      } else if (bal === null) { m = month(s, k, 0, 1); m.zero = true; }
      else m = month(s, k, fut && !s.carry ? last.amount : bal, 1);
      m.past = k < k0; bal = m.end;
      if (k === k0) cum = 0;
      m.cum = s.carry || k < k0 ? m.end : (cum += m.free); m.pos = position(s, k); out.push(m);
    }
    return out;
  }
  const project = s => timeline(s).filter(m => !m.past), past = s => timeline(s).filter(m => m.past);

  return { checks, timeline, past, pad, sum, mOK, dOK, dim, shift, dateAt, addM, diff, days, today, dates, schedule, liquidity, loanEvents, loanAt, position, activeIn, month, project };
})();
if (typeof module === 'object') module.exports = D;
</script>

<script>
(() => {
'use strict';
const KEY = 'rootcash:desk:v1', $ = q => document.querySelector(q), $$ = q => document.querySelectorAll(q);
const uid = () => crypto.randomUUID?.() || 'rc-' + Date.now() + Math.random().toString(36).slice(2);
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '\n': '&#10;' };
const esc = v => String(v ?? '').replace(/[&<>"'\n]/g, c => ESC[c]);

/* ----- Định dạng ----- */
const nf = new Intl.NumberFormat('vi-VN'), dec = (v, d) => v.toLocaleString('vi-VN', { maximumFractionDigits: d });
const sign = n => Math.round(n) < 0 ? '−' : '';
const money = n => sign(n) + nf.format(Math.round(Math.abs(n))) + 'đ';
const signed = n => (n > 0 ? '+' : '') + money(n);
const short = n => {
  const a = Math.abs(n);
  return sign(n) + (a >= 1e9 ? dec(a / 1e9, 2) + ' tỷ' : a >= 1e6 ? dec(a / 1e6, a >= 1e8 ? 0 : 1) + 'tr' : a >= 1e3 ? dec(a / 1e3, 0) + 'k' : Math.round(a) + 'đ');
};
const mil = (n, d = Math.abs(n) >= 1e8 ? 0 : 1) => sign(n) + dec(Math.abs(n) / 1e6, d);
const pct = x => (x * 100).toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '%';
const mShort = k => `T${+k.slice(5)}/${k.slice(2, 4)}`, mLong = k => `Tháng ${+k.slice(5)}/${k.slice(0, 4)}`;
const dLabel = d => `${d.slice(8)}/${d.slice(5, 7)}/${d.slice(0, 4)}`;
const cls = n => n < 0 ? 'neg' : 'pos', negOnly = n => n < 0 ? 'neg' : '';
const sw = c => `<i class="sw" style="background:var(--${c})"></i>`;

/* ----- Dữ liệu ----- */
const blank = () => {
  const t = D.today();
  return { v: 3, openDate: t, start: t.slice(0, 7), sel: t.slice(0, 7), horizon: 12, opening: 0, checks: [{ date: t, amount: 0 }], carry: true, incomes: [], living: { items: [] }, loans: [] };
};
const int = (v, min = 0, max = 1e13) => Math.min(max, Math.max(min, Math.round(+v || 0)));
const pick = (v, list) => list.includes(v) ? v : list[0];
const month = v => D.mOK(v) ? v : null;
/* Lần chốt mới nhất quyết định "hiện tại": openDate / opening / start luôn suy ra từ đó (giữ tương thích file cũ). */
function syncChecks(s) {
  s.checks.sort((a, b) => a.date < b.date ? -1 : 1);
  const last = s.checks[s.checks.length - 1]; s.openDate = last.date; s.opening = last.amount; s.start = last.date.slice(0, 7);
}

function normLoan(x) {
  const basis = pick(x.basis, ['none', 'flat', 'reducing', 'fixed', 'total']);
  const l = {
    id: String(x.id || uid()), dir: pick(x.dir, ['borrow', 'lend']), label: String(x?.label ?? '').slice(0, 120) || 'Khoản vay', principal: int(x.principal, 1),
    start: x.start, first: D.dOK(x.first) && x.first >= x.start ? x.first : D.addM(x.start, 1),
    mode: pick(x.mode, ['equal', 'bullet', 'annuity']), basis,
    timing: basis === 'none' ? 'periodic' : pick(x.timing, ['periodic', 'upfront', 'end']),
    rate: Math.min(100, Math.max(0, +x.rate || 0)), unit: pick(x.unit, ['month', 'year']), fixed: int(x.fixed),
    disburse: !!x.disburse, open: !!x.open, ...(x.note ? { note: String(x.note).slice(0, 200) } : {})
  };
  l.end = D.dOK(x.end) ? x.end : D.addM(l.first, int(x.term, 1, 360) - 1);           // bản cũ chỉ có số kỳ
  if (l.end < l.first) l.end = l.first;
  if (D.dates(l).length > 360) l.end = D.addM(l.first, 359);
  return l;
}

function norm(r) {                                                                   // ép mọi dữ liệu đọc vào về đúng cấu trúc
  const s = blank(); if (!r || typeof r !== 'object') return s;
  const label = x => String(x?.label ?? '').slice(0, 120), id = x => String(x?.id || uid());
  if (D.dOK(r.openDate)) s.openDate = r.openDate; else if (D.mOK(r.start)) s.openDate = r.start + '-01';
  s.start = s.openDate.slice(0, 7);
  s.horizon = pick(+r.horizon, [12, 6, 24]); s.opening = int(r.opening, -1e13); s.carry = r.carry !== false;
  const byMonth = new Map((Array.isArray(r.checks) ? r.checks : []).filter(c => D.dOK(c?.date))
    .map(c => [c.date.slice(0, 7), { date: c.date, amount: int(c.amount, -1e13) }]));       // mỗi tháng một lần chốt
  if (!byMonth.size) byMonth.set(s.openDate.slice(0, 7), { date: s.openDate, amount: s.opening });
  s.checks = [...byMonth.values()]; syncChecks(s);
  s.sel = D.mOK(r.sel) && r.sel >= s.start && r.sel <= D.shift(s.start, s.horizon - 1) ? r.sel : s.start;
  s.incomes = (r.incomes || []).map(x => ({ id: id(x), label: label(x), amount: int(x.amount), day: int(x.day, 1, 31), from: month(x.from), until: month(x.until) }));
  const items = (r.living?.items || []).map(x => ({ id: id(x), label: label(x), amount: int(x.amount), from: month(x.from), until: month(x.until) }));
  if (r.living && 'total' in r.living) {                                            // bản cũ: một khung tổng + các mục chia → mục hàng tháng, phần dư thành "Khác"
    const left = int(r.living.total) - D.sum(items.filter(x => !x.from && !x.until), x => x.amount);
    if (left > 0) items.push({ id: uid(), label: items.length ? 'Khác' : 'Chi phí', amount: left, from: null, until: null });
  }
  s.living = { items };
  s.loans = (r.loans || []).filter(x => x && D.dOK(x.start) && x.principal > 0).map(normLoan);
  return s;
}

/* Nhận file sao lưu của Rootcash webapp (v2): thu → Thu, chi cố định → mục chi phí, trả nợ → khoản vay 0 lãi cần bổ sung. */
function fromV2(d) {
  const k = D.mOK(d.active) ? d.active : D.today().slice(0, 7), of = kind => (d.items || []).filter(i => i.kind === kind);
  const livKey = Object.keys(d.living || {}).filter(x => x <= k).sort().pop(), liv = livKey ? d.living[livKey] : 0;
  const items = [...(liv ? [{ label: 'Chi phí', amount: liv }] : []), ...of('fixed')];
  const once = of('once').filter(i => i.sign === 1 && D.dOK(i.date));
  const loans = of('debt').map(i => {
    const from = D.mOK(i.from) ? i.from : k, n = D.mOK(i.until) ? Math.max(1, D.diff(from, i.until) + 1) : 120, first = D.dateAt(from, i.day || 1);
    return { id: i.id, label: i.label, principal: i.amount * n, start: D.addM(first, -1), first, term: n, mode: 'equal', basis: 'none', note: 'Nhập từ webapp — bổ sung gốc, lãi, kỳ hạn' };
  });
  const incomes = [...of('in'), ...once.map(i => ({ ...i, day: +i.date.slice(8), from: i.date.slice(0, 7), until: i.date.slice(0, 7) }))];
  return {
    skipped: of('once').length - once.length,
    data: norm({ start: k, opening: Math.max(0, d.openings?.[k] || 0), incomes, living: { total: D.sum(items, i => i.amount), items }, loans })
  };
}

function demo() {
  const t = D.today(), k = t.slice(0, 7), at = (n, d) => D.dateAt(D.shift(k, n), d);
  const L = (label, principal, start, term, o) => ({ label, principal, start, first: D.addM(start, 1), term, mode: 'equal', basis: 'flat', rate: 1.5, ...o });
  return norm({
    openDate: t, opening: 15e6,
    incomes: [{ label: 'Lương', amount: 32e6, day: 5 }, { label: 'Kinh doanh', amount: 12e6, day: 20 }],
    living: { items: [{ label: 'Nhà', amount: 5e6 }, { label: 'Ăn uống', amount: 5.5e6 }, { label: 'Đi lại', amount: 1.5e6 },
      { label: 'Quà Tết', amount: 8e6, from: D.shift(k, 2), until: D.shift(k, 2) }] },
    loans: [
      L('Trả góp A', 120e6, at(-3, 10), 12),
      L('Vay ngắn B (đáo hạn lẻ ngày)', 50e6, at(0, 14), 0, { first: at(1, 14), end: at(3, 25), mode: 'bullet', basis: 'reducing', rate: 12, unit: 'year' }),
      L('Vay C (lãi trả trước)', 60e6, at(1, 15), 6, { timing: 'upfront', rate: 2, disburse: true }),
      L('Bạn D', 20e6, at(-2, 1), 1, { basis: 'none', open: true }),
      L('Cho anh H vay', 40e6, at(-1, 10), 10, { dir: 'lend', rate: 1, first: at(0, 25) }),
      L('Cho bạn P mượn', 5e6, at(-1, 3), 1, { dir: 'lend', basis: 'none', open: true })
    ]
  });
}

/* Lưu trữ: dữ liệu nằm ngay trên máy này. Rootcash.exe mở trang trong hồ sơ riêng nên không lẫn với trình duyệt thường. */
let S = blank(), loadErr = '', toastTimer;
const toast = t => { $('#toast').textContent = t; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('#toast').textContent = '', 4500); };
try { const raw = localStorage.getItem(KEY); if (raw) S = norm(JSON.parse(raw)); } catch { loadErr = 'Không đọc được dữ liệu đã lưu.'; }
function save() {
  if (loadErr) return;                                                              // không ghi đè lên dữ liệu chưa đọc được
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch { toast('Không lưu được — hãy Xuất file để giữ dữ liệu.'); }
  autoSave();
}

/* Tự lưu ra file: Rootcash.exe chạy một máy chủ nhỏ chỉ trong máy (127.0.0.1) và ghi bản sao JSON vào Documents\Rootcash
   (bản mới nhất + một bản mỗi ngày). Mã khoá k do exe sinh ra, truyền qua #k=… nên trang khác không đọc/ghi được. */
const AK = new URLSearchParams(location.hash.slice(1)).get('k'), AUTO = /^[a-f0-9]{32}$/.test(AK || '');
const autoUrl = p => `http://127.0.0.1:47613/${p}?k=${AK}`;
const exportBody = () => JSON.stringify({ format: 'rootcash-desktop', version: 3, exportedAt: new Date().toISOString(), data: S }, null, 2);
let autoState = AUTO ? 'Đang kết nối tự lưu…' : 'Dữ liệu lưu trong app · tự lưu ra file khi mở bằng Rootcash.exe', autoT;
const setAuto = t => { autoState = t; const e = $('#autoState'); if (e) e.textContent = t; };
function autoSave(now) {
  if (!AUTO || loadErr) return;
  clearTimeout(autoT);
  autoT = setTimeout(async () => {
    try {
      const r = await fetch(autoUrl('save'), { method: 'POST', body: exportBody() }), j = await r.json();
      if (!r.ok) throw 0;
      setAuto(`Đã tự lưu ${new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' })} · ${j.dir}`);
    } catch { setAuto('Chưa tự lưu được ra file — dữ liệu vẫn nằm trong app'); }
  }, now ? 0 : 1500);
}
const isEmpty = () => !S.incomes.length && !S.loans.length && !S.living.items.length;

const ui = { open: new Set(), tab: 'borrow', days: new Set(), pend: {} };                     // dòng thu mở thời hạn; tab bảng khoản; ngày đang mở chi tiết

const seg = (act, opts, val) => `<div class="seg">${opts.map(([v, t]) =>

const moneyIn = (v, attr) => `<input class="money" inputmode="numeric" value="${v ? sign(v) + nf.format(Math.abs(v)) : ''}" placeholder="0" ${attr}>`;
const delBtn = `<button class="ic" data-act="del" title="Xoá">×</button>`;

/* Kiểu lặp của một khoản thu / chi: hàng tháng | chỉ một tháng | khoảng tháng tuỳ chọn. */
const recOf = x => !x.from && !x.until ? 'monthly' : x.from === x.until ? 'once' : 'range';
const recName = x => ({ monthly: 'Hàng tháng', once: `Chỉ ${x.from && mShort(x.from)}`,
  range: `${x.from ? mShort(x.from) : '…'} → ${x.until ? mShort(x.until) : '…'}` })[recOf(x)];
const recBtn = x => `<button class="rec ${recOf(x)}" data-act="rec" data-tip="Bấm để đổi: Hàng tháng → Chỉ tháng đang xem → Khoảng tháng">${recName(x)}</button>`;
const rangeBox = x => recOf(x) === 'range' || ui.open.has(x.id) ? `<div class="extra">Từ <input type="month" data-f="from" value="${x.from || ''}">
  đến hết <input type="month" data-f="until" value="${x.until || ''}"></div>` : '';
const incRow = x => `<div class="row" data-id="${x.id}">
  <input data-f="label" value="${esc(x.label)}" placeholder="Tên nguồn thu">${recBtn(x)}
  <label class="day">ngày<input data-f="day" type="number" min="1" max="31" value="${x.day}"></label>
  ${moneyIn(x.amount, 'data-f="amount"')}${delBtn}${rangeBox(x)}</div>`;
const livRow = x => `<div class="row liv" data-id="${x.id}">
  <input data-f="label" value="${esc(x.label)}" placeholder="Tên khoản chi">${recBtn(x)}${moneyIn(x.amount, 'data-f="amount"')}${delBtn}${rangeBox(x)}</div>`;

function render() {
  const keep = { y: scrollY, p: $('.pbody')?.scrollTop || 0, d: $('.dash')?.scrollTop || 0 };   // giữ nguyên vị trí cuộn → không giật
  const nB = S.loans.filter(l => l.dir !== 'lend').length, nL = S.loans.length - nB;
  $('#app').innerHTML = `
<header class="top">
  <div class="brand"><img src="${$('link[rel=icon]').href}" alt="">Rootcash</div>
  <div class="nav">
    <button data-act="step" data-v="-1" aria-label="Tháng trước">‹</button><h1 id="selLabel"></h1>

  <div class="side acts">

  </div>
</header>
${loadErr ? `<div class="banner bad"><b>${loadErr}</b><span>Mọi thay đổi lúc này sẽ không được lưu.</span></div>` : ''}
${isEmpty() ? `<div class="banner"><span><b>Khung đang trống.</b> Nhập số dư, Thu, Chi phí và Khoản vay — hoặc xem thử dữ liệu mẫu.</span>
  <button class="btn pri" data-act="demo">Nạp ví dụ</button></div>` : ''}
<div class="app">
  <aside class="card panel"><div class="pbody">
    <header><h2>Khung</h2></header>
    <div class="bal">
      <div class="balhd"><span class="cap mut" id="balCap">Số dư chốt</span><button class="ic" id="unchk" data-act="unchk" title="Bỏ chốt tháng này">×</button></div>
      ${moneyIn(0, 'id="opening"')}
      <label class="when" data-tip="Số dư thật tại đầu ngày này. Mỗi tháng chốt riêng, tháng khác không bị ghi đè">Tại đầu ngày <input type="date" id="openDate"></label>

    <div class="sec"><span class="cap">${sw('in')}Thu</span><i class="dots"></i><span class="n pos" id="incSum"></span></div>
    <div class="rows" id="incomes">${S.incomes.map(incRow).join('')}</div>
    <div class="rows" id="collects"></div>
    <div class="info addline"><button class="add" data-act="add-income">+ Thêm nguồn thu</button><span id="incHidden"></span></div>
    <div class="sec"><span class="cap">${sw('liv')}Chi phí</span><small id="livDay"></small><i class="dots"></i><span class="n" id="livSum"></span></div>
    <div class="rows" id="living">${S.living.items.map(livRow).join('')}</div>
    <div class="info addline"><button class="add" data-act="add-living">+ Thêm khoản chi</button><span id="livHidden"></span></div>
    <div class="sec"><span class="cap">${sw('pri')}Trả nợ</span><small id="debtMeta"></small><i class="dots"></i><span class="n" id="debtSum"></span></div>
    <div class="rows" id="debts"></div>

  <main class="dash">
    <section class="figs" id="figs"></section>

        <div class="side"><span class="mut" id="loanSum"></span><button class="btn pri" data-act="new-loan">+ ${ui.tab === 'lend' ? 'Thêm khoản cho vay' : 'Thêm khoản vay'}</button></div></header>
