/* ----- Giao diện: phần kết quả (vẽ lại sau mỗi lần gõ) ----- */
function draw() {
  const P = D.project(S), m = cur = P.find(x => x.k === S.sel) || D.past(S).find(x => x.k === S.sel) || P[0];
  const loans = S.loans.map(l => {
    const sc = D.schedule(l);
    return { l, sc, at: D.loanAt(l, m.k, sc), lq: D.liquidity(l, sc), ev: D.loanEvents(l, m.k, sc).filter(e => e.cat === 'principal' || e.cat === 'interest' || e.cat === 'collect') };
  });
  $('#selLabel').textContent = mLong(m.k);
  $('#projFrom').textContent = `Từ ${dLabel(S.openDate)}`;
  drawBal(m); drawFigs(m, loans); drawMonths(P, m); drawDay(m); drawFrame(m, loans); drawPos(P, m); drawLoans(m, loans);
}

const isLend = o => o.l.dir === 'lend';

/* Ô số dư đi theo tháng đang xem: tháng đã chốt thì sửa số chốt của tháng đó; chưa chốt thì gõ số là chốt mới.
   Dòng dưới: số dư khung dự tính tại ngày chốt và phần lệch (chốt − dự tính). */
const chkOf = k => S.checks.find(c => c.date.slice(0, 7) === k);
function drawBal(m) {
  const c = m.check, amt = $('#opening'), date = $('#openDate');
  $('.bal').classList.toggle('unset', !c);
  $('#balCap').textContent = c ? `Số dư chốt ${mShort(m.k)}` : `Chưa chốt ${mShort(m.k)}`;
  $('#unchk').hidden = !c || S.checks.length < 2;
  if (document.activeElement !== amt) amt.value = c ? sign(c.amount) + nf.format(Math.abs(c.amount)) : '';
  amt.placeholder = c ? '0' : m.zero ? '0' : nf.format(Math.round(m.opening));
  if (document.activeElement !== date) date.value = c ? c.date : ui.pend[m.k] || m.k + '-01';
  $('#balNote').innerHTML = c && m.expect != null
    ? `Khung dự tính <b>${short(m.expect)}</b> · lệch <b class="${negOnly(m.diff)}">${m.diff > 0 ? '+' : ''}${short(m.diff)}</b>`
    : c ? 'Lần chốt đầu tiên' : m.zero ? 'Trước lần chốt đầu, tính từ 0đ' : `Dự tính đầu tháng ${short(m.opening)} · gõ số để chốt`;
}

/* Thẻ xanh: chỉ Free float. Bốn thẻ còn lại là biểu đồ nhỏ, chi tiết nằm trong tooltip. */
function drawFigs(m, loans) {
  const due = loans.filter(o => !isLend(o) && o.ev.length), base = D.sum(due, o => o.l.principal);
  const card = (cap, body, tip) => `<div class="card fig" data-tip="${esc(tip)}"><span class="cap mut">${cap}</span>${body}</div>`;
  const mo = +m.k.slice(5);

  // 1. Trả nợ / Thu — vòng tròn: phần xanh dương là phần thu đi trả nợ
  const share = m.inflow ? m.debt / m.inflow : 0, C = 2 * Math.PI * 26;
  const ring = `<span class="n">${m.inflow ? pct(share) : '—'}</span>
    <div class="ringbox"><div class="ringw"><svg class="ring" viewBox="0 0 64 64"><circle class="trk" cx="32" cy="32" r="26"/>
      <circle class="val" cx="32" cy="32" r="26" stroke-dasharray="${Math.min(1, share) * C} ${C}" transform="rotate(-90 32 32)"/></svg></div>
    <div class="leg"><span>${sw('in')}Thu<b>${short(m.inflow)}</b></span><span>${sw('pri')}Trả nợ<b>${short(m.debt)}</b></span></div></div>`;

  // 2. Rate = M/x + i — tiền phải trả tháng này trên mỗi đồng gốc đến hạn
  const mx = base ? m.principal / base : 0, ii = base ? m.interest / base : 0;
  const rate = base ? `<span class="n">${pct(mx + ii)}</span><div class="split"><i style="width:${mx / (mx + ii) * 100}%;background:var(--pri)"></i><i style="flex:1;background:var(--int)"></i></div>
    <div class="leg row"><span>${sw('pri')}M/X<b>${pct(mx)}</b></span><span>${sw('int')}i<b>${pct(ii)}</b></span></div>
    <p>Trên <b>${short(base)}</b> gốc đến hạn</p>`
    : `<span class="n mut">—</span><p>Không có khoản đến hạn</p>`;

  // 3. Đáy số dư — số dư cuối từng ngày, cột đậm = ngày thấp nhất
  const vals = m.days.map(d => d.end), lo = Math.min(0, ...vals), hi = Math.max(lo + 1, ...vals);
  const bars = m.days.map(d => `<i class="${d === m.low ? 'lo ' + (d.end < 0 ? 'ngl' : '') : d.end < 0 ? 'ng' : ''}" style="height:${Math.max(4, (d.end - lo) / (hi - lo) * 100)}%"></i>`).join('');
  const low = `<span class="n ${negOnly(m.low.end)}">${money(m.low.end)}</span><div class="mini">${bars}</div>
    <p>Ngày <b>${m.low.day}/${mo}</b>${m.low.end < 0 ? ` · cần bù <b>${short(-m.low.end)}</b>` : ''}</p>`;

  // 4. Số dư cuối tháng — thác nước tiền mặt: đầu kỳ + thu + tiền vay về − chi = cuối tháng
  const cat = c => D.sum(m.events.filter(e => c.includes(e.cat)), e => e.value), cashDays = m.dim - m.from + 1;
  const cin = cat(['income', 'collect']), vay = cat(['loanIn']), out = -cat(['principal', 'interest', 'lendOut']) + m.living * cashDays / m.dim;
  const steps = [['Đầu kỳ', 0, m.opening, 'var(--line2)'], ['Thu', m.opening, m.opening + cin, 'var(--in)'],
    ...(vay ? [['Vay về', m.opening + cin, m.opening + cin + vay, '#8FCBAE']] : []),
    ['Chi', m.opening + cin + vay, m.end, 'var(--pri)'], ['Cuối', 0, m.end, 'var(--brand)']];
  const wl = Math.min(0, ...steps.flatMap(s => [s[1], s[2]])), wh = Math.max(1, ...steps.flatMap(s => [s[1], s[2]]));
  const y = v => (v - wl) / (wh - wl) * 100;
  const wf = `<span class="n ${negOnly(m.end)}">${money(m.end)}</span>
    <div class="wf">${steps.map(([, a, b, c]) => `<div><i style="bottom:${y(Math.min(a, b))}%;height:${Math.max(2, Math.abs(y(b) - y(a)))}%;background:${c}"></i></div>`).join('')}</div>
    <div class="wfl">${steps.map(s => `<span>${s[0]}</span>`).join('')}</div>`;

  $('#figs').innerHTML = `<div class="card fig hero"><span class="cap">Free float</span><small>${mLong(m.k)}${m.past ? ' · đã qua' : ''}</small><span class="n ${negOnly(m.free)}">${money(m.free)}</span></div>`
    + card('Trả nợ / Thu', ring, `Cứ 100đ thu vào, ${m.inflow ? dec(share * 100, 0) : '—'}đ đi trả nợ`)
    + card('M/X + i (%)', rate, base ? `Tháng này phải trả ${money(m.debt)}\ntrên ${money(base)} gốc của các khoản đến hạn\nM/x = gốc ${money(m.principal)} · i = lãi ${money(m.interest)}` : 'Không có khoản đến hạn')
    + card('Đáy số dư', low, m.zero ? 'Trước lần chốt đầu tiên: tính như đầu tháng có 0đ.\nĐáy âm = số tiền cần có sẵn đầu tháng' : `Số dư tiền mặt thấp nhất trong tháng${m.from > 1 ? `, tính từ ngày ${m.from}` : ''}`)
    + card(m.zero ? 'Ròng cuối tháng' : 'Số dư cuối tháng', wf, `${m.zero ? 'Trước lần chốt đầu, tính từ 0đ đầu tháng' : 'Tiền mặt thực tế cuối tháng (khác free float)'}\nĐầu kỳ ${money(m.opening)}\n+ Thu ${money(cin)}${vay ? `\n+ Tiền vay về ${money(vay)}` : ''}\n− Chi & trả nợ ${money(out)}\n= ${money(m.end)}`);
}

/* Cột Thu (mint) chứa cột chi xếp chồng; phần mint lộ ra = free float; chấm đỏ = có ngày số dư âm trong tháng. */
function drawMonths(P, m) {
  const dense = S.horizon > 12, cumName = S.carry ? 'Buffer cuối tháng' : 'Đầu tư luỹ kế';
  const max = Math.max(1, ...P.map(x => Math.max(x.inflow, x.living + x.debt)));
  const col = x => {
    const mo = +x.k.slice(5), label = mo === 1 ? `1/${x.k.slice(2, 4)}` : (dense ? '' : 'T') + mo;
    const tip = [mLong(x.k), `Thu ${money(x.income)}`, x.collect && `Thu hồi cho vay ${money(x.collect)}`,
      `Chi phí ${money(-x.living)}`, `Trả gốc ${money(-x.principal)}`, `Trả lãi ${money(-x.interest)}`, `Free float ${money(x.free)}`,
      x.loanIn && `Tiền vay về +${money(x.loanIn)} (ngoài free float)`, x.lendOut && `Chuyển cho vay ${money(-x.lendOut)} (ngoài free float)`,
      `${cumName} ${money(x.cum)}`, x.low.end < 0 && `Đáy số dư ${money(x.low.end)} ngày ${x.low.day}`].filter(Boolean).join('\n');
    const inH = x.inflow / max * 100, outH = (x.living + x.debt) / max * 100;
    return `<button class="col ${x.k === m.k ? 'sel' : ''}" data-act="sel" data-v="${x.k}" data-tip="${esc(tip)}">
      <div class="bars">
        ${inH > 0 ? `<i class="inc" style="height:${inH}%"></i>` : ''}
        ${outH > inH ? `<i class="gap" style="bottom:${inH}%;height:${outH - inH}%"></i>` : ''}
        <div class="stk" style="height:${outH}%">
          <i style="flex:${x.living};background:var(--liv)"></i><i style="flex:${x.principal};background:var(--pri)"></i><i style="flex:${x.interest};background:var(--int)"></i>
        </div>
      </div>
      <span class="n ${cls(x.free)}">${dense ? mil(x.free, 0) : mil(x.free)}</span>
      <span class="cum ${x.cum < 0 ? 'neg' : 'mut'}">${mil(x.cum)}</span><span class="mo mut">${label}</span>
      ${x.low.end < 0 ? '<i class="dip"></i>' : ''}</button>`;
  };
  $('#proj').innerHTML = `<div class="cols ${dense ? 'dense' : ''}">
      <div class="col gut"><div class="bars"></div><span>Free float</span><span class="cum">${S.carry ? 'Buffer' : 'Luỹ kế'}</span><span>triệu đ</span></div>
      ${P.map(col).join('')}</div>
    <div class="key"><span><i class="sw inc"></i>Thu · phần lộ ra = free float</span><span>${sw('liv')}Chi phí</span><span>${sw('pri')}Trả gốc</span><span>${sw('int')}Trả lãi</span>
      <span><i class="sw gap"></i>Chi vượt thu</span>${P.some(x => x.low.end < 0) ? '<span><i class="sw dip"></i>Có ngày số dư âm</span>' : ''}</div>`;
}

function drawDay(m) {
  const negDays = m.days.filter(d => d.end < 0).length, mm = m.k.slice(5);
  $('#dayTitle').textContent = `Trong tháng ${+mm}` + (m.zero ? ' · trước lần chốt, tính từ 0đ' : m.from > 1 ? ` · từ ngày ${m.from}` : '');
  $('#dayTag').className = 'tag ' + (m.zero ? '' : negDays ? 'bad' : '');
  $('#dayTag').textContent = m.zero ? 'Trước lần chốt đầu' : negDays ? `${negDays} ngày âm` : 'Không có ngày âm';
  $('#dayChips').innerHTML = `<span class="chip">${m.from > 1 ? `Ngày ${m.from}` : 'Đầu tháng'}<b>${short(m.opening)}</b></span>
    <span class="chip">Thấp nhất<b class="${negOnly(m.low.end)}">${short(m.low.end)}</b> · ngày ${m.low.day}</span>
    <span class="chip">Cuối tháng<b class="${negOnly(m.end)}">${short(m.end)}</b></span>
    ${m.diff != null ? `<span class="chip" data-tip="${esc(`Chốt ngày ${m.from}: ${money(m.check.amount)}\nKhung dự tính: ${money(m.expect)}\nLệch = chốt − dự tính`)}">Lệch chốt<b class="${negOnly(m.diff)}">${m.diff > 0 ? '+' : ''}${short(m.diff)}</b></span>` : ''}`;
  dayChart(m);
  /* Gom theo ngày: mỗi ngày một dòng tổng (ròng). Bấm + mới mở chi tiết tiền vào / tiền ra. */
  const amt = v => `${v > 0 ? '+' : ''}${short(v)}`, days = [...new Set(m.events.map(e => e.day))];
  $('#events').innerHTML = days.map(d => {
    const evs = m.events.filter(e => e.day === d), ins = evs.filter(e => e.value > 0), outs = evs.filter(e => e.value < 0);
    const vin = D.sum(ins, e => e.value), vout = D.sum(outs, e => e.value), net = vin + vout, key = m.k + '-' + d, open = ui.days.has(key);
    const part = (list, cap, v) => list.length ? `<div class="evcap">${cap}<b class="${cls(v)}">${amt(v)}</b></div>` + list.map(e =>
      `<div class="evd" data-tip="${esc(`${e.label}\n${signed(e.value)}`)}"><span>${esc(e.label)}</span><span class="n ${cls(e.value)}">${amt(e.value)}</span></div>`).join('') : '';
    return `<div class="evg ${open ? 'open' : ''}">
      <button class="ev" data-act="day" data-v="${key}" aria-expanded="${open}"><span class="mut">${D.pad(d)}/${mm}</span>
        <span class="mut">${evs.length} khoản${ins.length && outs.length ? ` · vào ${short(vin)} · ra ${short(-vout)}` : ''}</span>
        <span class="n ${cls(net)}">${amt(net)}</span><i class="pm">${open ? '−' : '+'}</i></button>
      ${open ? `<div class="evbody">${part(ins, 'Tiền vào', vin)}${part(outs, 'Tiền ra', vout)}</div>` : ''}</div>`;
  }).join('') || '<div class="empty">Không có khoản nào rơi vào tháng này.</div>';
}

const dueRow = ({ l, ev }, inflow) => `<button class="row due" data-act="edit-loan" data-v="${l.id}"
  data-tip="${esc(`${l.label}\nNgày ${[...new Set(ev.map(e => e.day))].join(', ')} · ${kindName(l)}`)}">
  <span class="dd ${inflow ? 'in' : ''}">${ev[0].day}</span><b>${esc(l.label)}</b><i class="dots"></i><span class="n ${inflow ? 'pos' : ''}">${inflow ? '+' : ''}${money(Math.abs(D.sum(ev, e => e.value)))}</span></button>`;

function drawFrame(m, loans) {
  $('#incSum').textContent = money(m.inflow);
  /* Danh sách Thu và Chi phí đi theo tháng đang xem: khoản không thuộc tháng này thì ẩn. */
  const byMonth = (sel, list, box, word) => {
    let hidden = 0;
    $$(sel + ' .row').forEach(r => {
      const x = list.find(o => o.id === r.dataset.id), on = D.activeIn(x, m.k);
      r.hidden = !on; hidden += !on;
      const c = r.querySelector('.rec'); c.textContent = recName(x); c.className = 'rec ' + recOf(x);
    });
    $(box).textContent = hidden ? `${hidden} ${word} ở tháng khác` : '';
  };
  byMonth('#incomes', S.incomes, '#incHidden', 'khoản thu');
  byMonth('#living', S.living.items, '#livHidden', 'khoản chi');
  $('#collects').innerHTML = loans.filter(o => isLend(o) && o.ev.length).map(o => dueRow(o, 1)).join('');
  $('#livSum').textContent = money(m.living);
  $('#livDay').textContent = m.living ? `≈ ${short(m.living / m.dim)}/ngày` : '';

  const due = loans.filter(o => !isLend(o) && o.ev.length);
  $('#debtMeta').textContent = m.debt ? `gốc ${short(m.principal)} · lãi ${short(m.interest)}` : '';
  $('#debtSum').textContent = money(m.debt);
  $('#debts').innerHTML = due.map(o => dueRow(o)).join('') || `<p class="note">${S.loans.length ? 'Không có khoản đến hạn.' : 'Chưa có khoản vay.'}</p>`;
  const open = loans.filter(o => o.l.open && o.at.state !== 'future'), oB = open.filter(o => !isLend(o)), oL = open.filter(isLend);
  const line = (a, t) => a.length ? `${t} <b>${short(D.sum(a, o => o.l.principal))}</b>` : '';
  $('#openNote').innerHTML = open.length ? `<p class="note one" data-tip="${esc(open.map(o => `${isLend(o) ? 'Cho vay' : 'Đi vay'} · ${o.l.label}  ${money(o.l.principal)}`).join('\n') + '\nKhông tính vào tháng nào')}">
    Chưa hẹn ngày: ${[line(oB, 'nợ'), line(oL, 'phải thu')].filter(Boolean).join(' · ')}</p>` : '';
  $('#ffSum').className = 'n ' + cls(m.free); $('#ffSum').textContent = money(m.free);
}

/* Vị thế nợ: bạn đang vay bao nhiêu, cho vay bao nhiêu, gap ròng, và tháng nào số dư đủ lấp gap. */
function drawPos(P, m) {
  const p = m.pos, cover = P.find(x => x.k >= m.k && x.pos.net > 0 && x.end >= x.pos.net);
  const last = P[P.length - 1], short4 = (cap, val, note, c = '') => `<div class="t4 ${c}"><span class="cap ${c ? '' : 'mut'}">${cap}</span><span class="n">${val}</span><small>${note}</small></div>`;
  $('#posFrom').textContent = `Cuối ${mShort(m.k)}`;
  const gapNote = p.net <= 0 ? 'Cho vay ≥ đi vay' : cover ? `Số dư đủ lấp từ ${mShort(cover.k)}` : `Đến ${mShort(last.k)} còn thiếu ${short(last.pos.net - last.end)}`;
  const max = Math.max(1, ...P.map(x => Math.max(x.pos.net, x.end, 0)));
  $('#pos').innerHTML = `<div class="tiles4">
      ${short4('Đang vay', money(p.borrow), `${p.nB} khoản · lãi còn ${short(p.intPay)}`)}
      ${short4('Cho vay', money(p.lend), `${p.nL} khoản · lãi sẽ thu ${short(p.intGet)}`)}
      ${short4('Nợ ròng (gap)', money(p.net), 'Đang vay − cho vay', 'dark')}
      ${short4('Lấp gap', p.net <= 0 ? 'Đã cân' : m.past ? 'Đã qua' : `${short(Math.max(0, p.net - m.end))} còn thiếu`, gapNote)}
    </div>
    <div class="gapc">${P.map(x => `<button class="${x.k === m.k ? 'sel' : ''}" data-act="sel" data-v="${x.k}"
        data-tip="${esc(`${mLong(x.k)}\nĐang vay ${money(x.pos.borrow)}\nCho vay ${money(x.pos.lend)}\nNợ ròng ${money(x.pos.net)}\nSố dư cuối tháng ${money(x.end)}`)}">
        <span class="pr"><i style="height:${Math.max(0, x.pos.net) / max * 100}%;background:var(--pri)"></i><i style="height:${Math.max(0, x.end) / max * 100}%;background:var(--in)"></i></span>
        <span>${mShort(x.k).replace(/\/\d+$/, '')}</span></button>`).join('')}</div>`;
}

function drawLoans(m, loans) {
  const k = m.k, lend = ui.tab === 'lend', list = loans.filter(o => isLend(o) === lend);
  const live = list.filter(o => o.at.state !== 'future'), bal = D.sum(live, o => o.at.balance);
  $('#loanSum').innerHTML = list.length ? `${lend ? 'Còn phải thu' : 'Dư nợ'} cuối ${mShort(k)} <b>${money(bal)}</b>` : '';
  if (!list.length) return $('#loans').innerHTML = `<div class="empty">${lend ? 'Chưa có khoản cho vay. Thêm để theo dõi lịch thu gốc, lãi theo ngày.' : 'Chưa có khoản vay. Mỗi khoản vay tự sinh lịch trả gốc, lãi theo đúng ngày.'}</div>`;
  /* Mỗi khoản một dòng: tên + số chính. Chi tiết nằm trong tooltip và hộp sửa khi bấm vào. */
  const row = ({ l, sc, at, lq, ev }) => {
    const st = { future: 'Chưa bắt đầu', done: 'Đã tất toán' }[at.state];
    const tip = [l.label, `${kindName(l)} · ${rateName(l)}`, `${lend ? 'Cho vay' : 'Vay'} ${dLabel(l.start)} · gốc ${money(l.principal)}`,
      l.open ? `Chưa hẹn ngày trả gốc${sc.rows.length ? ` · lãi ngày ${+l.first.slice(8)} hằng tháng` : ''}` : `${sc.term} kỳ · ${sc.span} ngày · tổng lãi ${money(sc.total)}`,
      lq && `M/x = ${mxParts(l, lq, sc)}`, st, l.note].filter(Boolean).join('\n');
    const pay = Math.abs(D.sum(ev, e => e.value));
    return `<tr class="${at.state !== 'live' && !ev.length ? 'off' : ''}" data-act="edit-loan" data-v="${l.id}" data-tip="${esc(tip)}" tabindex="0">
      <td><i class="st ${at.state === 'live' ? (lend ? 'lend' : '') : at.state}"></i>${esc(l.label)}</td>
      <td class="n">${money(at.state === 'future' ? l.principal : at.balance)}</td>
      <td>${l.open ? '<span class="mut">—</span>' : `<span class="kp"><span class="prog"><i style="width:${at.paid / sc.term * 100}%"></i></span>${at.paid}/${sc.term}</span>`}</td>
      <td class="n ${lend && pay ? 'pos' : ''}">${pay ? money(pay) : '<span class="mut">—</span>'}</td>
      ${lq ? `<td class="mut">${pct(lq.p)}</td><td class="mut">${pct(lq.i)}</td><td class="n">${pct(lq.rate)}</td>` : '<td class="mut">—</td><td class="mut">—</td><td class="mut">—</td>'}
      <td>${l.open ? '<span class="mut">Chưa hẹn</span>' : dLabel(sc.end)}</td></tr>`;
  };
  $('#loans').innerHTML = `<table>
    <colgroup><col><col style="width:9rem"><col style="width:7rem"><col style="width:8.5rem"><col style="width:5.4rem"><col style="width:5rem"><col style="width:5.6rem"><col style="width:7rem"></colgroup>
    <thead><tr><th>${lend ? 'Khoản cho vay' : 'Khoản vay'}</th><th>${lend ? 'Còn phải thu' : 'Còn lại'}</th><th>Kỳ</th><th>${lend ? 'Thu' : 'Trả'} ${mShort(k)}</th>
      <th data-tip="Gốc kỳ đầu / gốc vay">M/X</th><th data-tip="Lãi kỳ đầu / gốc vay">i</th><th data-tip="Rate = M/x + i">Rate</th><th>Đáo hạn</th></tr></thead>
    <tbody>${list.map(row).join('')}</tbody></table>`;
}

/* Vẽ theo đúng số pixel đang có → chữ không bị kéo giãn khi đổi cỡ cửa sổ hay thu phóng. */
function dayChart(m) {
  const svg = $('#day'), W = svg.clientWidth, H = svg.clientHeight; if (!W) return;
  const rem = parseFloat(getComputedStyle(document.documentElement).fontSize), n = m.dim, d0 = m.from - 1, span = Math.max(1, n - d0);
  const l = 3.3 * rem, r = .7 * rem, t = .7 * rem, b = 1.5 * rem;
  const P = [[d0, m.opening], ...m.days.map(d => [d.day, d.end])], vals = P.map(p => p[1]);
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); if (hi === lo) hi = lo + 1;
  const pad = (hi - lo) * .12; hi += pad; if (lo < 0) lo -= pad;
  const x = p => +(l + (p - d0) / span * (W - l - r)).toFixed(1), y = v => +(t + (hi - v) / (hi - lo) * (H - t - b)).toFixed(1), y0 = y(0);
  const pts = P.map(([p, v]) => `${x(p)},${y(v)}`), area = `M${x(d0)},${y0}L${pts.join('L')}L${x(n)},${y0}Z`;
  const grid = [0, 1, 2, 3].map(i => lo + (hi - lo) * i / 3).map(v =>
    `<line x1="${l}" x2="${W - r}" y1="${y(v)}" y2="${y(v)}" stroke="#E6EAE4"/><text x="${l - .5 * rem}" y="${y(v) + .25 * rem}" text-anchor="end">${short(v)}</text>`).join('');
  const part = (id, col, fill) => `<g clip-path="url(#${id})"><path d="${area}" fill="${fill}"/>
    <polyline points="${pts.join(' ')}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/></g>`;
  const dots = m.days.filter(d => d.rows.length).map(d =>
    `<circle cx="${x(d.day)}" cy="${y(d.end)}" r="3.4" fill="#fff" stroke="${D.sum(d.rows, e => e.value) < 0 ? '#3159C8' : '#167A55'}" stroke-width="2"/>`).join('');
  const cand = W < 26 * rem ? [10, 20] : [5, 10, 15, 20, 25];
  const ticks = [m.from, ...cand.filter(d => d > m.from + 1 && d < n - 1), n].map(d =>
    `<text x="${x(d)}" y="${H - .3 * rem}" text-anchor="middle">${d}</text>`).join('');
  const hover = m.days.map(d => {
    const tip = `Ngày ${d.day}/${+m.k.slice(5)} · cuối ngày ${money(d.end)}` + d.rows.map(e => `\n${signed(e.value)}  ${e.label}`).join('');
    return `<rect x="${x(d.day - 1)}" y="${t}" width="${Math.max(1, x(d.day) - x(d.day - 1))}" height="${H - t - b}" fill="transparent" data-tip="${esc(tip)}"/>`;
  }).join('');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `<defs><clipPath id="up"><rect width="${W}" height="${y0}"/></clipPath>
      <clipPath id="dn"><rect y="${y0}" width="${W}" height="${H - y0}"/></clipPath></defs>
    ${grid}<line x1="${l}" x2="${W - r}" y1="${y0}" y2="${y0}" stroke="#A3B1A9" stroke-dasharray="4 4"/>
    ${part('up', '#167A55', '#E2EFE7')}${part('dn', '#C2412D', '#F7E6E2')}${dots}
    <circle cx="${x(m.low.day)}" cy="${y(m.low.end)}" r="4.5" fill="${m.low.end < 0 ? '#C2412D' : '#15211B'}" stroke="#fff" stroke-width="2"/>
    ${ticks}${hover}`;
}

function spark(sc) {
  const max = Math.max(1, ...sc.rows.map(r => r.pay)), bar = (v, c) => `<i style="height:${v / max * 100}%;background:var(--${c})"></i>`;
  return `<div class="spark">${sc.rows.map(r => `<span>${bar(r.interest, 'int')}${bar(r.principal, 'pri')}</span>`).join('')}</div>`;
}

/* ----- Khoản vay / cho vay: tên gọi và hộp sửa ----- */
const PRESET = {
  friend: { basis: 'none', timing: 'periodic' }, install: { mode: 'equal', timing: 'periodic' },
  upfront: { mode: 'equal', timing: 'upfront' }, io: { mode: 'bullet', timing: 'periodic' }
};
const kindOf = l => l.basis === 'none' ? 'friend' : l.timing === 'upfront' ? 'upfront' : l.timing === 'end' ? '' : l.mode === 'bullet' ? 'io' : 'install';
const kindName = l => ({ friend: 'Không lãi', install: l.mode === 'annuity' ? 'Góp đều' : 'Trả góp', upfront: 'Lãi trả trước', io: 'Chỉ trả lãi' }[kindOf(l)] || 'Lãi cuối kỳ');
const rateName = l => (l.open ? 'chưa hẹn ngày · ' : '') + rateOnly(l);
const rateOnly = l => l.basis === 'none' ? (l.open ? 'không lãi' : l.mode === 'bullet' ? 'gốc lúc đáo hạn' : 'gốc đều')
  : l.basis === 'fixed' ? `lãi cố định ${short(l.fixed)}/kỳ`
  : l.basis === 'total' ? `tổng lãi ${short(l.fixed)}`
  : `${dec(l.rate, 4)}%/${l.unit === 'year' ? 'năm' : 'tháng'} ${l.basis === 'flat' ? 'phẳng' : 'dư nợ giảm dần'} · theo ngày`;
const mxParts = (l, lq, sc) => `${pct(lq.p)} gốc${l.mode === 'equal' ? ` (1/${sc.term})` : ''} + ${pct(lq.i)} lãi`;
const loanErr = l => !(l.principal > 0) ? 'Nhập số tiền.'
  : !D.dOK(l.start) ? 'Chọn ngày bắt đầu.'
  : l.open ? (l.basis !== 'none' && (!D.dOK(l.first) || l.first < l.start) ? 'Ngày trả lãi kỳ đầu phải từ ngày bắt đầu trở đi.' : '')
  : !D.dOK(l.first) || l.first < l.start ? 'Ngày kỳ đầu phải từ ngày bắt đầu trở đi.'
  : !D.dOK(l.end) || l.end < l.first ? 'Ngày đáo hạn phải từ ngày kỳ đầu trở đi.'
  : D.dates(l).length > 360 ? 'Tối đa 360 kỳ.' : '';

const dlg = $('#dlg'); let draft = null, isNew = false;
function openLoan(id) {
  const l = S.loans.find(x => x.id === id), t = D.today(); isNew = !l;
  draft = l ? JSON.parse(JSON.stringify(l)) : {
    id: uid(), dir: ui.tab, label: '', principal: 0, start: t, first: D.addM(t, 1), end: D.addM(t, 12),
    mode: 'equal', basis: 'flat', timing: 'periodic', rate: 1.5, unit: 'month', fixed: 0, disburse: false, open: false
  };
  paintLoan(); dlg.showModal();
}

function paintLoan() {
  const l = draft, lend = l.dir === 'lend', W = lend ? { thing: 'khoản cho vay', start: 'Ngày cho vay', pay: 'thu' } : { thing: 'khoản vay', start: 'Ngày vay', pay: 'trả' };
  if (l.basis === 'none') l.timing = 'periodic';
  if (l.open && l.basis === 'total') l.basis = 'fixed';                              // chưa hẹn ngày thì không có "tổng lãi"
  if (l.mode === 'annuity' && !(l.basis === 'reducing' && l.timing === 'periodic')) l.mode = 'equal';
  const pctBasis = l.basis === 'flat' || l.basis === 'reducing', n = loanErr(l) ? 1 : D.dates(l).length || 1;
  const modes = [['equal', 'Đều mỗi kỳ'], ['bullet', 'Một lần lúc đáo hạn']];
  if (l.basis === 'reducing' && l.timing === 'periodic') modes.push(['annuity', 'Góp đều (gốc + lãi)']);
  dlg.innerHTML = `<div class="dhead"><h2>${isNew ? 'Thêm' : 'Sửa'} ${W.thing}</h2><button class="btn" data-act="close">Đóng</button></div>
  <div class="dbody"><div class="form">
    <div class="grid">
      <label>Tên<input data-f="label" value="${esc(l.label)}" placeholder="${lend ? 'Ví dụ: Cho anh A vay' : 'Ví dụ: Vay A'}" maxlength="120"></label>
      <label>Số tiền ${lend ? 'cho vay' : 'vay'} (đồng)${moneyIn(l.principal, 'data-f="principal"')}</label>
    </div>
    <div class="lab">Kiểu (chọn nhanh)${seg('preset', [['friend', 'Không lãi'], ['install', 'Trả góp'],
      ['upfront', 'Lãi trả trước'], ['io', 'Chỉ trả lãi, gốc cuối']], kindOf(l))}</div>
    <label class="check"><input type="checkbox" data-f="open" ${l.open ? 'checked' : ''}>
      Chưa hẹn ngày ${W.pay} gốc — lãi (nếu có) vẫn ${W.pay} hằng tháng</label>
    <div class="grid">
      <label>${W.start}<input type="date" data-f="start" value="${l.start}"></label>
      ${l.open ? (l.basis !== 'none' ? `<label>Ngày ${W.pay} lãi kỳ đầu (lặp hằng tháng)<input type="date" data-f="first" value="${l.first}"></label>` : '') : `<label>Ngày ${W.pay} kỳ đầu<input type="date" data-f="first" value="${l.first}"></label>
      <label>Ngày đáo hạn<input type="date" data-f="end" value="${l.end}"></label>`}
    </div>
    ${l.open ? '' : `<div class="grid">
      <label>Số kỳ (đặt nhanh ngày đáo hạn)<input type="number" min="1" max="360" data-f="term" value="${n}"></label>
      <div class="lab">Thời gian<p class="metab" id="meta"></p></div>
    </div>
    <div class="lab">Gốc${seg('set-mode', modes, l.mode)}</div>`}
    <div class="lab">Cách tính lãi${seg('set-basis', [['none', 'Không lãi'], ['flat', 'Phẳng'],
      ['reducing', 'Dư nợ giảm dần'], ['fixed', 'Cố định mỗi kỳ'], ...(l.open ? [] : [['total', 'Tổng tiền lãi']])], l.basis)}</div>
    ${pctBasis ? `<div class="lab">Lãi suất<div class="rate"><input type="number" min="0" max="100" step="any" data-f="rate" value="${l.rate}">
      ${seg('set-unit', [['month', '% / tháng'], ['year', '% / năm']], l.unit)}</div>
      <p class="hint">Lãi theo ngày thực tế của từng kỳ: lãi ngày = lãi năm ÷ 365${l.unit === 'month' ? ' = lãi tháng × 12 ÷ 365' : ''}.</p></div>` : ''}
    ${l.basis === 'fixed' || l.basis === 'total' ? `<label>${l.basis === 'fixed' ? 'Tiền lãi mỗi kỳ' : 'Tổng tiền lãi cả khoản'} (đồng)${moneyIn(l.fixed, 'data-f="fixed"')}</label>
      ${l.basis === 'total' && l.timing === 'periodic' ? '<p class="hint">Chia cho từng kỳ theo số ngày thực tế, tổng khớp từng đồng.</p>' : ''}` : ''}
    ${l.open && l.basis !== 'none' ? `<p class="hint">Lãi ${W.pay} mỗi tháng vào ngày ${+l.first.slice(8)}, tính trên toàn bộ gốc cho tới khi bạn hẹn ngày ${W.pay} gốc.</p>` : ''}
    ${l.basis !== 'none' && !l.open ? `<div class="lab">Thời điểm ${W.pay} lãi${seg('set-timing', [['periodic', 'Mỗi kỳ'], ['upfront', 'Trả trước, vào ngày kỳ đầu'], ['end', 'Một lần lúc đáo hạn']], l.timing)}</div>` : ''}
    <label class="check"><input type="checkbox" data-f="disburse" ${l.disburse ? 'checked' : ''}>
      ${lend ? 'Tiền chưa chuyển đi — trừ khỏi số dư vào ngày cho vay' : 'Tiền vay chưa về tài khoản — cộng vào số dư vào ngày vay'}</label>
    <p class="hint">Chỉ tích khi khoản tiền này chưa nằm trong số dư bạn nhập. Tiền giải ngân không bao giờ tính vào free float.</p>
    <p class="err" id="err"></p>
  </div><div id="preview"></div></div>
  <div class="dfoot"><div>${isNew ? '' : `<button class="btn danger" data-act="del-loan">Xoá ${W.thing}</button>`}</div>
    <div class="side"><button class="btn" data-act="close">Huỷ</button><button class="btn pri" data-act="save-loan">Lưu</button></div></div>`;
  meta(); preview();
}

const setVal = (f, v) => { const e = dlg.querySelector(`[data-f=${f}]`); if (e && e !== document.activeElement) e.value = v; };
function meta() {
  const box = $('#meta'); if (!box) return;
  if (loanErr(draft)) return box.textContent = '—';
  const sc = D.schedule(draft), dd = sc.rows.map(r => r.days), lo = Math.min(...dd), hi = Math.max(...dd);
  setVal('term', sc.term);
  box.textContent = `${sc.term} kỳ · ${sc.span} ngày` + (sc.term > 1 && lo !== hi ? ` · kỳ ${lo}–${hi} ngày` : '');
}

function preview() {
  const l = draft, box = $('#preview'), err = loanErr(l), lend = l.dir === 'lend';
  $('#err').textContent = l.principal > 0 ? err : '';
  if (err) return box.innerHTML = `<div class="empty">Nhập số tiền và các ngày để xem lịch.</div>`;
  if (l.open) {
    const sc = D.schedule(l), r0 = sc.rows[1] || sc.rows[0], next = sc.rows.filter(r => r.date >= D.today()).slice(0, 12);   // kỳ thường (kỳ đầu có thể dài/ngắn)
    return box.innerHTML = `<div class="tiles"><div class="tile main2"><small>Gốc ${lend ? 'phải thu' : 'nợ'} chưa hẹn ngày</small><b>${money(l.principal)}</b>
      <small>Tính vào vị thế nợ. Khi chốt được ngày ${lend ? 'thu' : 'trả'} gốc, bỏ tích để lên lịch.</small></div>
      ${r0 ? `<div class="tile"><small>Lãi mỗi tháng</small><b>${money(r0.interest)}</b><small>${pct(r0.interest / l.principal)} gốc</small></div>
      <div class="tile"><small>Ngày ${lend ? 'thu' : 'trả'} lãi</small><b>Ngày ${+l.first.slice(8)}</b><small>hằng tháng, từ ${dLabel(l.first)}</small></div>` : ''}</div>
      ${next.length ? `<div class="tbl"><table><thead><tr><th>Ngày ${lend ? 'thu' : 'trả'} lãi</th><th>Số ngày</th><th>Lãi</th></tr></thead>
        <tbody>${next.map(r => `<tr><td>${dLabel(r.date)}</td><td>${r.days}</td><td><b>${nf.format(r.interest)}</b></td></tr>`).join('')}</tbody></table></div>` : ''}`;
  }
  const sc = D.schedule(l), lq = D.liquidity(l, sc), hasPeak = lq.peak.pay > lq.first.pay;
  const tile = (cap, val, note, attr = '') => `<div class="tile" ${attr}><small>${cap}</small><b>${val}</b><small>${note}</small></div>`;
  box.innerHTML = `<div class="tiles">
      <div class="tile main2"><small>Rate kỳ đầu (${lend ? 'tiền thu' : 'tiền trả'} / gốc)</small><b>${pct(lq.rate)}</b>
        <small>Rate = M/x ${pct(lq.p)} + i ${pct(lq.i)} · kỳ đầu ${money(lq.first.pay)}</small></div>
      ${tile(lend ? 'Tổng lãi sẽ thu' : 'Tổng lãi', money(sc.total), `${pct(sc.total / l.principal)} gốc · ${sc.span} ngày`)}
      ${tile('Đáo hạn', dLabel(sc.end), hasPeak ? `đỉnh ${short(lq.peak.pay)} ngày ${dLabel(lq.peak.date)}` : `${sc.term} kỳ`)}
      ${sc.upfront ? tile(`Lãi trả trước · ngày ${dLabel(l.first)}`, money(sc.upfront), `toàn bộ lãi ${sc.span} ngày, cùng kỳ đầu`, 'style="grid-column:1/-1"') : ''}
    </div>
    ${spark(sc)}<div class="key" style="margin-top:.4rem"><span>${sw('pri')}Gốc</span><span>${sw('int')}Lãi</span></div>
    <div class="tbl"><table>
      <thead><tr><th>Kỳ · ngày</th><th>Số ngày</th><th>Gốc</th><th>Lãi</th><th>${lend ? 'Thu' : 'Phải trả'}</th><th>Dư nợ</th></tr></thead>
      <tbody>${sc.rows.map(r => `<tr><td>${r.i} · ${dLabel(r.date)}</td><td>${r.days}</td><td>${nf.format(r.principal)}</td><td>${nf.format(r.interest)}</td>
        <td><b>${nf.format(r.pay)}</b></td><td>${nf.format(r.after)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ----- Sự kiện ----- */
function fmtInput(el, allowNeg) {                                                    // gõ số có dấu chấm ngăn nghìn, giữ vị trí con trỏ
  const neg = allowNeg && /^\s*[-−]/.test(el.value);
  const before = el.value.slice(0, el.selectionStart).replace(/\D/g, '').length;
  const d = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, '').slice(0, 13);
  el.value = (neg ? '−' : '') + (d ? nf.format(+d) : '');
  let i = neg ? 1 : 0, c = 0; while (c < before && i < el.value.length) { if (/\d/.test(el.value[i])) c++; i++; }
  el.setSelectionRange(i, i); return (neg ? -1 : 1) * (+d || 0);
}

function loanInput(el, f, v) {
  if (!f) return;
  const d = draft, ok = !loanErr(d) && !d.open, n = ok ? D.dates(d).length : 0, reg = ok && d.end === D.addM(d.first, n - 1);
  if (f === 'start') {
    if (!D.dOK(v)) return;
    const autoFirst = d.first === D.addM(d.start, 1); d.start = v;
    if (autoFirst && !d.open) { d.first = D.addM(v, 1); setVal('first', d.first); if (reg) { d.end = D.addM(d.first, n - 1); setVal('end', d.end); } }
  }
  else if (f === 'first') { if (!D.dOK(v)) return; d.first = v; if (reg) { d.end = D.addM(v, n - 1); setVal('end', d.end); } }
  else if (f === 'end') { if (!D.dOK(v)) return; d.end = v; }
  else if (f === 'term') { if (!v || !D.dOK(d.first)) return; d.end = D.addM(d.first, int(v, 1, 360) - 1); setVal('end', d.end); }
  else if (f === 'open') { d.open = el.checked; if (!d.open && !(d.end >= d.first)) { d.first = D.addM(d.start, 1); d.end = d.first; } return paintLoan(); }
  else d[f] = el.type === 'checkbox' ? el.checked : el.type === 'number' ? +v || 0 : v;
  meta(); preview();
}

document.addEventListener('input', e => {
  const el = e.target, f = el.dataset.f, v = el.classList.contains('money') ? fmtInput(el, el.id === 'opening') : el.value;
  if (el.closest('dialog')) return loanInput(el, f, v);
  if (el.id === 'opening' || el.id === 'openDate') {                                     // chốt tháng: chỉ đụng tới lần chốt của đúng tháng đó
    const c = chkOf(S.sel);
    if (el.id === 'opening') {
      if (c) c.amount = v; else S.checks.push({ date: ui.pend[S.sel] || S.sel + '-01', amount: v });
    } else {
      if (!D.dOK(v)) return;
      const k = v.slice(0, 7);
      if (!c) { ui.pend[k] = v; S.sel = k; save(); return draw(); }                     // chưa có số: nhớ ngày, chờ gõ số
      const other = chkOf(k); if (other && other !== c) S.checks.splice(S.checks.indexOf(other), 1);
      c.date = v; S.sel = k;
    }
    syncChecks(S);
  }
  else {
    const row = el.closest('.row'); if (!row) return;
    const x = (row.parentElement.id === 'incomes' ? S.incomes : S.living.items).find(o => o.id === row.dataset.id);
    x[f] = f === 'day' ? int(v || 1, 1, 31) : f === 'from' || f === 'until' ? month(v) : v;
  }
  save(); draw();
});

/* Mỗi nút một hành động. false = không làm gì thêm; 'soft' = lưu + chỉ vẽ lại số liệu (không dựng lại trang → không giật). */
const rowId = el => el.closest('.row').dataset.id;
const ACT = {
  sel: v => { S.sel = v; return 'soft'; },
  step: v => { const k = D.shift(S.sel, +v); if (k >= (D.past(S)[0]?.k || S.start) &&k <= D.shift(S.start, S.horizon - 1)) S.sel = k; return 'soft'; },
  unchk: () => { const c = chkOf(S.sel); if (!c || S.checks.length < 2) return false; S.checks.splice(S.checks.indexOf(c), 1); syncChecks(S); return 'soft'; },
  carry: v => { S.carry = v === '1'; },
  horizon: v => { S.horizon = +v; },
  tab: v => { ui.tab = v; },
  day: v => { ui.days.has(v) ? ui.days.delete(v) : ui.days.add(v); return 'view'; },
  'add-income': () => { S.incomes.push({ id: uid(), label: '', amount: 0, day: 1, from: S.sel, until: S.sel }); },   // mặc định: chỉ tháng đang xem
  'add-living': () => { S.living.items.push({ id: uid(), label: '', amount: 0, from: S.sel, until: S.sel }); },   // mặc định: chỉ tháng đang xem
  del: (v, el) => { const id = rowId(el); S.incomes = S.incomes.filter(x => x.id !== id); S.living.items = S.living.items.filter(x => x.id !== id); },
  rec: (v, el) => {                                                                // Hàng tháng → Chỉ tháng đang xem → Khoảng tháng → Hàng tháng
    const id = rowId(el), x = [...S.incomes, ...S.living.items].find(o => o.id === id), r = recOf(x);
    if (r === 'monthly') x.from = x.until = S.sel;
    else if (r === 'once') { x.until = null; ui.open.add(id); }
    else { x.from = x.until = null; ui.open.delete(id); }
  },
  demo: () => { S = demo(); toast('Đã nạp dữ liệu mẫu — không phải số thật.'); },
  reset: () => { if (!confirm('Xoá toàn bộ khung? Nên Xuất file trước.')) return false; S = blank(); loadErr = ''; },
  export: () => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([exportBody()], { type: 'application/json' }));
    a.download = `rootcash-desktop-${D.today()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    return false;
  },
  import: () => { $('#file').click(); return false; },
  'new-loan': () => { openLoan(); return false; },
  'edit-loan': v => { openLoan(v); return false; },
  close: () => { dlg.close(); return false; },
  preset: v => { Object.assign(draft, PRESET[v]); if (v !== 'friend' && draft.basis === 'none') draft.basis = 'flat'; paintLoan(); return false; },
  'save-loan': () => {
    const err = loanErr(draft); if (err) { $('#err').textContent = err; return false; }
    draft.label = draft.label.trim() || (draft.dir === 'lend' ? 'Khoản cho vay' : 'Khoản vay'); delete draft.note;
    const i = S.loans.findIndex(x => x.id === draft.id); if (i < 0) S.loans.push(draft); else S.loans[i] = draft;
    ui.tab = draft.dir; dlg.close();
  },
  'del-loan': () => { if (!confirm(`Xoá "${draft.label}"?`)) return false; S.loans = S.loans.filter(x => x.id !== draft.id); dlg.close(); }
};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, v = el.dataset.v;
  if (act.startsWith('set-')) { draft[act.slice(4)] = v; return paintLoan(); }             // các nút chọn trong hộp khoản vay
  const r = ACT[act]?.(v, el); if (r === false || !ACT[act]) return;
  if (r === 'soft') { save(); return draw(); }
  if (r === 'view') { const t = $('#events').scrollTop; drawDay(cur); $('#events').scrollTop = t; return; }   // chỉ đổi cách xem, không đụng dữ liệu
  S = norm(S); save(); render();
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches?.('tr[data-act]')) e.target.click(); });

$('#file').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const raw = JSON.parse(await f.text()); let next, note = 'Đã nhập file.';
    if (raw?.format === 'rootcash-desktop' && raw.data) next = norm(raw.data);
    else if (raw?.format === 'rootcash-backup' && raw.data?.items) {
      const r = fromV2(raw.data); next = r.data;
      note = `Đã chuyển từ Rootcash webapp. Các khoản trả nợ cần bổ sung gốc/lãi${r.skipped ? `; bỏ qua ${r.skipped} khoản chi một lần` : ''}.`;
    }
    else throw 0;
    if (!isEmpty() && !confirm('Thay toàn bộ khung hiện tại bằng file này?')) return;
    S = next; loadErr = ''; save(); render(); toast(note);
  } catch { toast('File không phải sao lưu Rootcash hợp lệ.'); }
});

const tip = $('#tip');
document.addEventListener('mousemove', e => {
  const el = e.target.closest?.('[data-tip]'); if (!el) return tip.textContent = '';
  tip.textContent = el.dataset.tip; const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(innerWidth - w - 8, e.clientX + 14) + 'px';
  tip.style.top = (e.clientY + h + 24 > innerHeight ? e.clientY - h - 12 : e.clientY + 18) + 'px';
});
document.addEventListener('scroll', () => tip.textContent = '', { capture: true, passive: true });
render();
/* Mở lên mà app trống (máy mới, hồ sơ bị xoá…) → tự lấy lại bản tự lưu gần nhất; ngược lại lưu ngay một bản. */
if (AUTO) (async () => {
  if (isEmpty() && !loadErr) try {
    const r = await fetch(autoUrl('latest'));
    if (r.ok) { const raw = await r.json(); if (raw?.data) { S = norm(raw.data); save(); render(); toast('Đã khôi phục từ bản tự lưu gần nhất.'); return; } }
  } catch {}
  autoSave(true);
})();
})();
</script>
